<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Monitoring Box</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; }
        
        .container { max-width: 900px; margin: 0 auto; }

        /* ส่วนหัวเว็บไซต์ */
        .header-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        @media(min-width: 768px) {
            .header-card { flex-direction: row; text-align: left; }
        }

        .character-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .header-info .company-tag {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .header-info h1 { font-size: 1.5rem; color: #f8fafc; margin-bottom: 0.4rem; }
        .header-info p { font-size: 0.85rem; color: #94a3b8; }

        /* ฟอร์มเพิ่มอัลบั้มใหม่ */
        .form-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .form-card h3 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 0.9rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.3rem;
        }

        .form-control {
            width: 100%;
            padding: 0.65rem 0.9rem;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
        }

        input[type="file"] {
            padding: 0.45rem;
            color: #94a3b8;
            cursor: pointer;
        }

        .btn-submit {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover { background-color: #059669; }

        /* ส่วนของอัลบั้มงาน */
        .section-title {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            font-weight: 600;
            border-left: 4px solid #38bdf8;
            padding-left: 0.5rem;
        }

        .album-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        @media(min-width: 640px) {
            .album-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .album-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .album-card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
        }

        .album-header-bar {
            background-color: #0f172a;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .album-img-preview {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid #334155;
            background-color: #0f172a;
        }

        .album-body {
            padding: 1.2rem;
        }

        .album-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 0.4rem;
        }

        .album-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            line-height: 1.4;
            white-space: pre-line;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            float: right;
        }
        .btn-delete:hover { text-decoration: underline; }

        .footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนหัว ข้อมูลภาพรวม -->
        <div class="header-card">
            <img src="big.jpeg" alt="Smart Monitoring Box Mascot" class="character-img">
            <div class="header-info">
                <div class="company-tag">QTC Energy PCL. • Rayong Field</div>
                <h1>Smart Monitoring Box - Work Archives</h1>
                <p>คลังจัดเก็บอัลบั้มภาพถ่าย Smart</p>
            </div>
        </div>

        <!-- เพิ่มอัลบั้มใหม่ -->
        <div class="form-card">
            <h3>➕ อัลบั้มใหม่</h3>
            <form id="albumForm">
                <div class="form-group">
                    <label>วันที่ปฏิบัติงาน</label>
                    <input type="text" id="albumDate" class="form-control" placeholder="เช่น 25 ต.ค. 2026" required>
                </div>
                <div class="form-group">
                    <label>ชื่องาน / หัวข้ออัลบั้ม</label>
                    <input type="text" id="albumTitle" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>รายละเอียด</label>
                    <textarea id="albumDesc" class="form-control" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>เลือกรูปภาพ (จากมือถือ / คอมพิวเตอร์)</label>
                    <input type="file" id="albumImageFile" class="form-control" accept="image/*" required>
                </div>
                <button type="submit" class="btn-submit">💾 บันทึก</button>
            </form>
        </div>

        <!-- รายการอัลบั้มงาน -->
        <div class="section-title">
            <span>📂 รายการอัลบั้มงาน</span>
        </div>
        
        <div class="album-grid" id="albumContainer">
            <!-- ข้อมูลอัลบั้มจะแสดงผลตรงนี้ -->
        </div>

        <div class="footer">
            ระบบบันทึกข้อมูลอัตโนมัติ • QTC Energy PCL.
        </div>
    </div>

    <script>
        let albums = JSON.parse(localStorage.getItem('qtc_smart_albums_v2')) || [];

        const albumContainer = document.getElementById('albumContainer');
        const albumForm = document.getElementById('albumForm');

        function renderAlbums() {
            albumContainer.innerHTML = '';
            if(albums.length === 0) {
                albumContainer.innerHTML = '<p style="color: #64748b; text-align: center; grid-column: span 2;">ยังไม่มีอัลบั้มบันทึกงาน กรุณาเพิ่มข้อมูลด้านบนครับ</p>';
                return;
            }
            albums.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'album-card';
                card.innerHTML = `
                    <div class="album-header-bar">
                        <span>📅 ${item.date}</span>
                        <span style="color: #34d399;">● เสร็จสิ้น</span>
                    </div>
                    ${item.image ? `<img src="${item.image}" alt="Work Image" class="album-img-preview">` : ''}
                    <div class="album-body">
                        <div class="album-title">${item.title}</div>
                        <div class="album-desc">${item.desc}</div>
                        <button class="btn-delete" onclick="deleteAlbum(${index})">🗑️ ลบอัลบั้มนี้</button>
                    </div>
                `;
                albumContainer.appendChild(card);
            });
        }

        albumForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('albumImageFile');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const newAlbum = {
                        date: document.getElementById('albumDate').value,
                        title: document.getElementById('albumTitle').value,
                        desc: document.getElementById('albumDesc').value,
                        image: event.target.result // แปลงรูปเป็น Base64
                    };

                    albums.unshift(newAlbum);
                    localStorage.setItem('qtc_smart_albums_v2', JSON.stringify(albums));
                    renderAlbums();
                    albumForm.reset();
                };
                reader.readAsDataURL(file);
            }
        });

        function deleteAlbum(index) {
            if(confirm('ต้องการลบอัลบั้มนี้ใช่หรือไม่?')) {
                albums.splice(index, 1);
                localStorage.setItem('qtc_smart_albums_v2', JSON.stringify(albums));
                renderAlbums();
            }
        }

        renderAlbums();
    </script>
</body>
</html>
