<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzM6LAjut8SRHhbgaXpHwrCIm0aeNo8fVV8v3K8JsC1af0xmA807cciiyoe_kn5wsYeyg/exec";

    const mainContainer = document.getElementById('mainContainer');
    const sectionTitle = document.getElementById('sectionTitle');
    const navButtonsGroup = document.getElementById('navButtonsGroup');
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    const stackControlsWrapper = document.getElementById('stackControlsWrapper');
    const searchCombinedInput = document.getElementById('searchCombinedInput');
    const categorySelect = document.getElementById('categorySelect');
    const loadingModal = document.getElementById('loadingModal');
    const systemStatusBadge = document.getElementById('systemStatusBadge');
    const installAppBtn = document.getElementById('installAppBtn');

    let allAlbumsData = [];
    let navigationLevel = 'years'; // 'years', 'months', 'albums'
    let currentSelectedYear = null;
    let currentSelectedMonth = null;
    let recentNewAlbums = [];

    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installAppBtn) installAppBtn.style.display = 'inline-flex';
    });

    async function installPWA() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') { installAppBtn.style.display = 'none'; }
            deferredPrompt = null;
        }
    }

    function openNotificationModal() { document.getElementById('notificationModal').style.display = 'flex'; }
    function closeNotificationModal() { document.getElementById('notificationModal').style.display = 'none'; }

    function markAllAsRead() {
        recentNewAlbums = [];
        let currentNames = allAlbumsData.map(a => a.folderName);
        localStorage.setItem('seen_albums', JSON.stringify(currentNames));
        updateNotificationUI();
        closeNotificationModal();
    }

    function updateNotificationUI() {
        const badge = document.getElementById('notificationBadge');
        const list = document.getElementById('notificationList');
        if (recentNewAlbums.length > 0) {
            badge.innerText = recentNewAlbums.length;
            badge.style.display = 'block';
            let html = '';
            recentNewAlbums.forEach(item => {
                html += `<div class="notification-item"><div class="title">📁 [${item.optionType}] ${item.folderName}</div><div class="date">📅 วันที่: ${item.month}</div></div>`;
            });
            list.innerHTML = html;
        } else {
            badge.style.display = 'none';
            list.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 1.5rem; font-size: 0.8rem;">ยังไม่มีอัลบั้มใหม่</div>';
        }
    }

    function setSystemStatus(status, text) {
        if (!systemStatusBadge) return;
        systemStatusBadge.className = `status-badge status-${status}`;
        let icon = status === 'orange' ? "🟠" : (status === 'red' ? "🔴" : "🟢");
        systemStatusBadge.innerHTML = `<span>${icon}</span> ${text}`;
    }

    window.addEventListener('online', () => {
        setSystemStatus('green', 'พร้อมใช้งาน');
        showToast("🟢 เชื่อมต่ออินเทอร์เน็ตแล้ว");
    });

    window.addEventListener('offline', () => {
        setSystemStatus('red', 'ขาดการเชื่อมต่ออินเทอร์เน็ต');
        showToast("🔴 อินเทอร์เน็ตหลุด! กำลังทำงานแบบออฟไลน์");
    });

    if (!navigator.onLine) {
        setSystemStatus('red', 'ไม่มีอินเทอร์เน็ต');
    }

    function updateLiveClock() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const clockEl = document.getElementById('liveClockDisplay');
        if (clockEl) clockEl.innerText = `${dateStr} ${timeStr}`;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    window.addEventListener('scroll', () => {
        scrollTopBtn.style.display = window.scrollY > 200 ? 'flex' : 'none';
    });
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    // --- ระบบจัดการปุ่มออกแอป ---
    function openExitConfirmModal() {
        document.getElementById('exitConfirmModal').style.display = 'flex';
    }
    function cancelExit() {
        document.getElementById('exitConfirmModal').style.display = 'none';
        history.pushState({ level: 'years' }, '', window.location.href);
    }
    function confirmExit() {
        document.getElementById('exitConfirmModal').style.display = 'none';
        document.body.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 20px;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">👋</div>
                <h2 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem;">ออกจากระบบเรียบร้อยแล้ว</h2>
                <p style="color: #94a3b8; font-size: 0.875rem;">คุณสามารถปิดแท็บนี้หรือออกจากแอปพลิเคชันได้เลยครับ</p>
            </div>
        `;
    }

    // --- ระบบดักจับปุ่มย้อนกลับ (Back Button) ของมือถือแบบสมบูรณ์ ---
    window.addEventListener('popstate', (event) => {
        // 1. ถ้าเปิดดูรูปซูมอยู่ ให้ปิดรูปก่อนโดยไม่เปลี่ยนหน้าจอหลัก
        const imageModal = document.getElementById('imageModal');
        if (imageModal && imageModal.style.display === 'flex') {
            imageModal.style.display = 'none';
            history.pushState({ level: navigationLevel }, '', window.location.href);
            return;
        }

        // 2. ถ้าอยู่หน้าอัลบั้ม ให้ถอยกลับมาหน้าเดือน
        if (navigationLevel === 'albums') {
            navigationLevel = 'months';
            currentSelectedMonth = null;
            renderCurrentLevel();
            history.pushState({ level: 'months' }, '', window.location.href);
            return;
        }

        // 3. ถ้าอยู่หน้าเดือน ให้ถอยกลับมาหน้าปี (หน้าแรก)
        if (navigationLevel === 'months') {
            navigationLevel = 'years';
            currentSelectedYear = null;
            renderCurrentLevel();
            history.pushState({ level: 'years' }, '', window.location.href);
            return;
        }

        // 4. ถ้าอยู่ที่หน้าแรกสุด (หน้าปี) แล้วกดย้อนกลับ -> เด้ง Popup ถามออกแอป
        if (navigationLevel === 'years') {
            openExitConfirmModal();
            history.pushState({ level: 'years' }, '', window.location.href);
        }
    });

    window.onload = function() {
        history.replaceState({ level: 'years' }, '', window.location.href);
        initializeAppWithSplash();
        setInterval(backgroundSyncAlbums, 3000);
    };

    async function initializeAppWithSplash() {
        setSystemStatus('orange', 'กำลังซิงค์...');
        try {
            const response = await fetch(SCRIPT_URL + "?action=getAlbums");
            const result = await response.json();
            if (result.status === "success") {
                allAlbumsData = result.data || [];
                processNewAlbumsDetection(allAlbumsData);
                updateStats();
                renderCurrentLevel();
                setSystemStatus('green', 'พร้อมใช้งาน');
            } else {
                setSystemStatus('red', 'โหลดไม่สำเร็จ');
            }
        } catch (err) {
            setSystemStatus('red', 'เชื่อมต่อล้มเหลว');
        } finally {
            const splash = document.getElementById('app-splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                setTimeout(() => splash.style.display = 'none', 500);
            }
        }
    }

    async function fetchAllAlbums() {
        try {
            const response = await fetch(SCRIPT_URL + "?action=getAlbums");
            const result = await response.json();
            if (result.status === "success") {
                allAlbumsData = result.data || [];
                processNewAlbumsDetection(allAlbumsData);
                updateStats();
                renderCurrentLevel();
                setSystemStatus('green', 'พร้อมใช้งาน');
            }
        } catch (err) {
            setSystemStatus('red', 'เชื่อมต่อล้มเหลว');
        } finally {
            loadingModal.style.display = 'none';
        }
    }

    async function backgroundSyncAlbums() {
        if (document.getElementById('passwordModal').style.display === 'flex' || 
            document.getElementById('addImagesModal').style.display === 'flex' || 
            document.getElementById('loadingModal').style.display === 'flex' ||
            document.getElementById('imageModal').style.display === 'flex' ||
            document.getElementById('exitConfirmModal').style.display === 'flex') {
            return;
        }
        try {
            const response = await fetch(SCRIPT_URL + "?action=getAlbums");
            const result = await response.json();
            if (result.status === "success") {
                let newData = result.data || [];
                if (JSON.stringify(newData) !== JSON.stringify(allAlbumsData)) {
                    processNewAlbumsDetection(newData);
                    allAlbumsData = newData;
                    updateStats();
                    renderCurrentLevel();
                }
            }
        } catch (err) {}
    }

    function processNewAlbumsDetection(newData) {
        let seenAlbums = JSON.parse(localStorage.getItem('seen_albums') || '[]');
        if (seenAlbums.length === 0 && allAlbumsData.length === 0) {
            localStorage.setItem('seen_albums', JSON.stringify(newData.map(a => a.folderName)));
            return;
        }
        let seenSet = new Set(seenAlbums);
        newData.forEach(album => {
            if (!seenSet.has(album.folderName)) {
                if (!recentNewAlbums.some(n => n.folderName === album.folderName)) {
                    recentNewAlbums.push(album);
                }
                seenSet.add(album.folderName);
            }
        });
        localStorage.setItem('seen_albums', JSON.stringify(Array.from(seenSet)));
        updateNotificationUI();
    }

    function updateStats() {
        document.getElementById('statTotalAlbums').innerText = allAlbumsData.length;
        let totalImages = 0, smartCount = 0, freeCount = 0;
        allAlbumsData.forEach(album => {
            totalImages += (album.images ? album.images.length : 0);
            if (album.optionType === 'Smartแถม') freeCount++; else smartCount++;
        });
        document.getElementById('statTotalImages').innerText = totalImages;
        document.getElementById('statSmartAlbums').innerText = smartCount;
        document.getElementById('statFreeAlbums').innerText = freeCount;
    }

    function renderCurrentLevel() {
        stackControlsWrapper.style.display = 'none';
        searchCombinedInput.value = '';
        categorySelect.value = 'all';

        if (navigationLevel === 'years') {
            navButtonsGroup.style.display = 'none';
            sectionTitle.innerHTML = '<span>📁 เลือกปี</span>';
            renderYearsView();
        } else if (navigationLevel === 'months') {
            navButtonsGroup.style.display = 'flex';
            sectionTitle.innerHTML = `<span>📁 ปี ${currentSelectedYear} • เลือกเดือน</span>`;
            renderMonthsView();
        } else if (navigationLevel === 'albums') {
            navButtonsGroup.style.display = 'flex';
            sectionTitle.innerHTML = `<span>📁 ปี ${currentSelectedYear} / เดือน ${currentSelectedMonth}</span>`;
            stackControlsWrapper.style.display = 'flex';
            renderAlbumsView();
        }
    }

    function goToHome() {
        navigationLevel = 'years';
        currentSelectedYear = null;
        currentSelectedMonth = null;
        history.pushState({ level: 'years' }, '', window.location.href);
        renderCurrentLevel();
    }

    function goBackToFolderLevel() {
        if (navigationLevel === 'albums') {
            navigationLevel = 'months';
            currentSelectedMonth = null;
            history.pushState({ level: 'months' }, '', window.location.href);
        } else if (navigationLevel === 'months') {
            navigationLevel = 'years';
            currentSelectedYear = null;
            history.pushState({ level: 'years' }, '', window.location.href);
        }
        renderCurrentLevel();
    }

    function renderYearsView() {
        let yearsMap = {};
        allAlbumsData.forEach(album => {
            let parts = album.month ? album.month.split('/') : [];
            let year = parts.length === 3 ? parts[2] : 'อื่นๆ';
            if (!yearsMap[year]) yearsMap[year] = { count: 0, images: 0 };
            yearsMap[year].count++;
            yearsMap[year].images += (album.images ? album.images.length : 0);
        });
        let html = '<div class="folder-grid">';
        Object.keys(yearsMap).sort().reverse().forEach(year => {
            html += `<div class="folder-card" onclick="selectYear('${year}')"><div class="folder-card-main"><div class="folder-icon">📁</div><div class="folder-info"><h3>ปี ${year}</h3><p>${yearsMap[year].count} อัลบั้ม (${yearsMap[year].images} รูป)</p></div></div></div>`;
        });
        html += '</div>';
        mainContainer.innerHTML = html;
    }

    function selectYear(year) {
        currentSelectedYear = year;
        navigationLevel = 'months';
        history.pushState({ level: 'months' }, '', window.location.href);
        renderCurrentLevel();
    }

    function renderMonthsView() {
        let monthsMap = {};
        allAlbumsData.forEach(album => {
            let parts = album.month ? album.month.split('/') : [];
            let year = parts.length === 3 ? parts[2] : 'อื่นๆ';
            if (year === currentSelectedYear) {
                let m = parts[1];
                if (!monthsMap[m]) monthsMap[m] = { count: 0, images: 0 };
                monthsMap[m].count++;
                monthsMap[m].images += (album.images ? album.images.length : 0);
            }
        });
        let monthNames = { "01": "มกราคม", "02": "กุมภาพันธ์", "03": "มีนาคม", "04": "เมษายน", "05": "พฤษภาคม", "06": "มิถุนายน", "07": "กรกฎาคม", "08": "สิงหาคม", "09": "กันยายน", "10": "ตุลาคม", "11": "พฤศจิกายน", "12": "ธันวาคม" };
        let html = '<div class="folder-grid">';
        Object.keys(monthsMap).sort().reverse().forEach(m => {
            html += `<div class="folder-card" onclick="selectMonth('${m}')"><div class="folder-card-main"><div class="folder-icon">📂</div><div class="folder-info"><h3>${monthNames[m] || 'เดือน ' + m} (${m})</h3><p>${monthsMap[m].count} อัลบั้ม (${monthsMap[m].images} รูป)</p></div></div></div>`;
        });
        html += '</div>';
        mainContainer.innerHTML = html;
    }

    function selectMonth(m) {
        currentSelectedMonth = m;
        navigationLevel = 'albums';
        history.pushState({ level: 'albums' }, '', window.location.href);
        renderCurrentLevel();
    }

    function renderAlbumsView() {
        let filtered = allAlbumsData.filter(album => {
            let parts = album.month ? album.month.split('/') : [];
            return (parts.length === 3 ? parts[2] : 'อื่นๆ') === currentSelectedYear && parts[1] === currentSelectedMonth;
        });
        if (categorySelect.value !== 'all') filtered = filtered.filter(a => a.optionType === categorySelect.value);
        let searchVal = searchCombinedInput.value.toLowerCase().trim();
        if (searchVal) filtered = filtered.filter(a => a.folderName.toLowerCase().includes(searchVal));

        if (filtered.length === 0) {
            mainContainer.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 2rem;">ไม่พบอัลบั้มภาพในเงื่อนไขนี้</div>';
            return;
        }
        let html = '<div class="album-grid">';
        filtered.forEach(album => {
            let imgs = album.images || [];
            html += `<div class="album-card"><div class="album-header-bar"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:0.5rem;" title="${album.folderName}">${album.folderName}</span><span class="badge-tag ${album.optionType === 'Smartแถม' ? 'badge-free' : 'badge-smart'}">${album.optionType === 'Smartแถม' ? 'Smart (แถม)' : 'Smart'}</span></div><div class="album-images-container">`;
            let displayCount = Math.min(imgs.length, 3);
            for (let i = 0; i < displayCount; i++) {
                html += `<img src="${imgs[i]}" class="thumb-img" onclick="openModal('${encodeURIComponent(JSON.stringify(imgs))}', ${i})">`;
            }
            if (imgs.length > 3) {
                html += `<div class="more-images-box" onclick="openModal('${encodeURIComponent(JSON.stringify(imgs))}', 3)"><span>+${imgs.length - 3}</span><span style="font-size:0.6rem;">ดูทั้งหมด</span></div>`;
            } else {
                for (let i = imgs.length; i < 4; i++) { html += `<div style="background:rgba(255,255,255,0.02); border-radius:5px; height:65px;"></div>`; }
            }
            html += `</div><div class="album-action-bar"><span class="album-footer-info">📅 ${album.month} (${imgs.length} รูป)</span><div class="action-btns"><button class="btn-action btn-download-album" onclick="downloadAlbumZip('${encodeURIComponent(album.folderName)}', '${encodeURIComponent(JSON.stringify(imgs))}')">⬇️ ZIP</button><button class="btn-action btn-add-img" onclick="promptAddImages('${album.folderName}')">➕ เพิ่ม</button><button class="btn-action btn-del-album" onclick="promptDeleteAlbum('${album.folderName}', '${album.optionType}')">🗑️ ลบ</button></div></div></div>`;
        });
        html += '</div>';
        mainContainer.innerHTML = html;
    }

    function applyFilters() { if (navigationLevel === 'albums') renderAlbumsView(); }

    let activeModalImages = [];
    let activeModalIndex = 0;
    let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false;
    let initialDistance = null;
    let touchStartX = 0, touchEndX = 0;

    function openModal(imagesJson, index) {
        activeModalImages = JSON.parse(decodeURIComponent(imagesJson));
        activeModalIndex = index;
        resetZoom();
        showImageInModal();
        document.getElementById('imageModal').style.display = 'flex';
        history.pushState({ level: 'modal' }, '', window.location.href);
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    function resetZoom() {
        scale = 1; pointX = 0; pointY = 0;
        updateImageTransform();
    }

    function showImageInModal() {
        const img = document.getElementById('modalImg');
        resetZoom();
        img.src = activeModalImages[activeModalIndex];
        document.getElementById('modalCounter').innerText = `${activeModalIndex + 1} / ${activeModalImages.length}`;
    }

    function nextImage() {
        if (scale > 1) return;
        activeModalIndex = (activeModalIndex + 1) % activeModalImages.length;
        showImageInModal();
    }

    function prevImage() {
        if (scale > 1) return;
        activeModalIndex = (activeModalIndex - 1 + activeModalImages.length) % activeModalImages.length;
        showImageInModal();
    }

    function updateImageTransform() {
        const img = document.getElementById('modalImg');
        img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    const modalImg = document.getElementById('modalImg');
    const modalWrapper = document.getElementById('modalWrapper');

    modalWrapper.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) {
            scale = Math.min(scale * 1.2, 5);
        } else {
            scale = Math.max(scale / 1.2, 1);
            if (scale === 1) { pointX = 0; pointY = 0; }
        }
        updateImageTransform();
    });

    modalWrapper.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            if (scale === 1) {
                touchStartX = e.touches[0].clientX;
            } else {
                isDragging = true;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
            }
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
    }, { passive: true });

    modalWrapper.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1 && scale > 1) {
            pointX = e.touches[0].clientX - startX;
            pointY = e.touches[0].clientY - startY;
            updateImageTransform();
        } else if (e.touches.length === 2 && initialDistance) {
            const currentDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            let newScale = scale * (currentDistance / initialDistance);
            scale = Math.max(1, Math.min(newScale, 5));
            if (scale === 1) { pointX = 0; pointY = 0; }
            initialDistance = currentDistance;
            updateImageTransform();
        }
    }, { passive: true });

    modalWrapper.addEventListener('touchend', (e) => {
        if (scale === 1 && e.changedTouches.length === 1) {
            touchEndX = e.changedTouches[0].clientX;
            let threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                nextImage();
            } else if (touchEndX > touchStartX + threshold) {
                prevImage();
            }
        }
        isDragging = false;
        initialDistance = null;
    });

    modalImg.addEventListener('mousedown', (e) => {
        if (scale > 1) {
            isDragging = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            e.preventDefault();
        }
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        pointX = e.clientX - startX;
        pointY = e.clientY - startY;
        updateImageTransform();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    modalImg.addEventListener('dblclick', () => {
        if (scale === 1) { scale = 2.5; } else { resetZoom(); }
        updateImageTransform();
    });

    async function downloadCurrentModalImage() {
        let imgUrl = activeModalImages[activeModalIndex];
        try {
            let response = await fetch(imgUrl);
            let blob = await response.blob();
            let blobUrl = window.URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = blobUrl; a.download = `Photo_${activeModalIndex + 1}.jpg`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            window.URL.revokeObjectURL(blobUrl);
        } catch (err) {
            let a = document.createElement('a');
            a.href = imgUrl; a.target = '_blank'; a.download = `Photo_${activeModalIndex + 1}.jpg`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
    }

    async function downloadAlbumZip(folderNameEncoded, imagesJson) {
        let folderName = decodeURIComponent(folderNameEncoded);
        let imgs = JSON.parse(decodeURIComponent(imagesJson));
        document.getElementById('loadingTitle').innerText = "กำลังสร้างไฟล์ ZIP";
        document.getElementById('loadingDesc').innerText = `กำลังรวบรวมรูปภาพ ${imgs.length} รูป...`;
        loadingModal.style.display = 'flex';
        try {
            const zip = new JSZip();
            for (let i = 0; i < imgs.length; i++) {
                let response = await fetch(imgs[i]);
                let blob = await response.blob();
                zip.file(`Photo_${i + 1}.jpg`, blob);
            }
            let content = await zip.generateAsync({ type: "blob" });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(content); a.download = `${folderName}.zip`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            loadingModal.style.display = 'none';
        } catch (err) {
            loadingModal.style.display = 'none';
            alert("ไม่สามารถสร้างไฟล์ ZIP ได้");
        }
    }

    let pendingAction = null;
    let selectedFolderName = '';

    function promptDeleteAlbum(folderName, optionType) {
        pendingAction = { type: 'deleteAlbum', folderName: folderName, optionType: optionType };
        document.getElementById('dialogTitle').innerText = "🔒 ใส่รหัสผ่านเพื่อลบ";
        document.getElementById('passwordSubText').innerText = "กรอกรหัสผ่านเพื่อดำเนินการต่อ";
        document.getElementById('adminPasswordInput').value = '';
        document.getElementById('passwordModal').style.display = 'flex';
        document.getElementById('adminPasswordInput').focus();
    }

    function promptAddImages(folderName) {
        selectedFolderName = folderName;
        document.getElementById('targetAlbumLabel').innerText = folderName;
        document.getElementById('additionalImagesInput').value = '';
        document.getElementById('fileUploadLabel').innerText = "📁 เลือกรูปภาพ (ยังไม่ได้เลือกไฟล์)";
        document.getElementById('addImagesModal').style.display = 'flex';
    }

    function updateFileNameLabel(input) {
        const label = document.getElementById('fileUploadLabel');
        if (input.files && input.files.length > 0) {
            label.innerText = input.files.length === 1 ? `📁 เลือกแล้ว: ${input.files[0].name}` : `📁 เลือกแล้ว: ${input.files.length} ไฟล์`;
        } else {
            label.innerText = "📁 เลือกรูปภาพ (ยังไม่ได้เลือกไฟล์)";
        }
    }

    function closePasswordModal() { document.getElementById('passwordModal').style.display = 'none'; }

    function checkPasswordLength(input) {
        if (input.value.length === 4) {
            if (input.value === "6004") {
                closePasswordModal();
                input.value = '';
                executePendingAction();
            } else {
                const subText = document.getElementById('passwordSubText');
                subText.innerText = "❌ รหัสผ่านไม่ถูกต้อง";
                subText.style.color = "#f87171";
                input.value = '';
                input.focus();
            }
        }
    }

    async function executePendingAction() {
        if (!pendingAction) return;
        if (pendingAction.type === 'deleteAlbum') {
            document.getElementById('loadingTitle').innerText = "กำลังลบอัลบั้ม";
            document.getElementById('loadingDesc').innerText = "โปรดรอสักครู่...";
            loadingModal.style.display = 'flex';
            try {
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', folderName: pendingAction.folderName, optionType: pendingAction.optionType, password: "6004" })
                });
                let result = await response.json();
                loadingModal.style.display = 'none';
                if (result.status === "success") {
                    showToast("ลบอัลบั้มสำเร็จ!");
                    fetchAllAlbums();
                } else {
                    alert("ลบไม่สำเร็จ: " + (result.message || ""));
                }
            } catch (err) {
                loadingModal.style.display = 'none';
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
            }
        }
        pendingAction = null;
    }

    async function fetchTotalImageCount() {
        try {
            let res = await fetch(SCRIPT_URL + "?action=getAlbums");
            let data = await res.json();
            if (data.status === "success") {
                let total = 0;
                (data.data || []).forEach(a => { total += (a.images ? a.images.length : 0); });
                return total;
            }
        } catch (err) {}
        return null;
    }

    function showToast(message) {
        const toast = document.getElementById('customToast');
        document.getElementById('toastMessage').innerText = message;
        toast.style.display = 'flex';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    async function uploadAdditionalImages() {
        let input = document.getElementById('additionalImagesInput');
        if (!input.files || input.files.length === 0) return alert("กรุณาเลือกรูปภาพ");
        document.getElementById('addImagesModal').style.display = 'none';
        const totalFiles = input.files.length;
        document.getElementById('loadingTitle').innerText = "กำลังอัปโหลด";
        document.getElementById('loadingDesc').innerText = `0/${totalFiles}`;
        loadingModal.style.display = 'flex';
        try {
            let filesArray = Array.from(input.files);
            let base64Images = [];
            for (let i = 0; i < filesArray.length; i++) {
                base64Images.push(await fileToBase64(filesArray[i], 2000));
                document.getElementById('loadingDesc').innerText = `${i + 1}/${totalFiles}`;
            }
            let response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'add_images', folderName: selectedFolderName, images: base64Images, password: "6004" })
            });
            let result = await response.json();
            loadingModal.style.display = 'none';
            if (result.status === "success") {
                showToast("เพิ่มรูปภาพสำเร็จ!");
                fetchAllAlbums();
            } else {
                alert("ผิดพลาด: " + result.message);
            }
        } catch (err) {
            loadingModal.style.display = 'none';
            alert("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ");
        }
    }

    function fileToBase64(file, maxDim = 2000) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
                    else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.95).split(',')[1]);
                };
            };
        });
    }
</script>
