<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Monitoring Box</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; }
        
        /* ขยายความกว้างรวมของหน้าเว็บให้รองรับการจัดวาง 2 ฝั่ง */
        .container { max-width: 1200px; margin: 0 auto; }

        /* ส่วนหัวเว็บไซต์ */
        .header-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem 2rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        @media(min-width: 768px) {
            .header-card { flex-direction: row; text-align: left; }
        }

        .character-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .header-info .company-tag {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .header-info h1 { font-size: 1.5rem; color: #f8fafc; margin-bottom: 0.4rem; }
        .header-info p { font-size: 0.85rem; color: #94a3b8; }

        /* จัด Layout ใหม่: แบ่งฝั่งซ้าย (ฟอร์ม) และฝั่งขวา (อัลบั้มงาน ~70%) */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media(min-width: 1024px) {
            .main-layout {
                grid-template-columns: 350px 1fr; /* ซ้าย 350px, ขวาที่เหลือ (~70%) */
                align-items: start;
            }
        }

        /* ฟอร์มเพิ่มอัลบั้มใหม่ (ให้อยู่ฝั่งซ้ายและเกาะติดจอเวลาเลื่อน) */
        .form-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            position: sticky;
            top: 2rem;
        }

        .form-card h3 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 0.9rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.3rem;
        }

        .form-control {
            width: 100%;
            padding: 0.65rem 0.9rem;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
        }

        input[type="file"] {
            padding: 0.45rem;
            color: #94a3b8;
            cursor: pointer;
        }

        .btn-submit {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover { background-color: #059669; }

        /* ฝั่งขวา: พื้นที่แสดงรายการอัลบั้ม */
        .content-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* ส่วนของอัลบั้มงาน */
        .section-title {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            font-weight: 600;
            border-left: 4px solid #38bdf8;
            padding-left: 0.5rem;
        }

        .album-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        @media(min-width: 640px) {
            .album-grid { grid-template-columns: repeat(2, 1fr); /* แสดงผลฝั่งขวาเป็น 2 คอลัมน์คู่กัน */ }
        }

        .album-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .album-card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
        }

        .album-header-bar {
            background-color: #0f172a;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        /* ขยายขนาดรูปในอัลบั้มให้ใหญ่และชัดเจนขึ้น */
        .album-img-preview {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid #334155;
            background-color: #0f172a;
        }

        .album-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .album-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 0.4rem;
        }

        .album-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            line-height: 1.4;
            white-space: pre-line;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            align-self: flex-end;
        }
        .btn-delete:hover { text-decoration: underline; }

        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #64748b;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนหัว ข้อมูลภาพรวม -->
        <div class="header-card">
            <img src="big.jpeg" alt="Smart Monitoring Box Mascot" class="character-img">
            <div class="header-info">
                <div class="company-tag">QTC Energy PCL. • Rayong</div>
                <h1>Smart Monitoring Box - Work Archives</h1>
                <p>คลังจัดเก็บอัลบั้มภาพถ่าย Smart</p>
            </div>
        </div>

        <!-- โครงสร้างจัดวางแบบใหม่: ซ้ายเป็นฟอร์ม / ขวาเป็นรายการอัลบั้ม (~70%) -->
        <div class="main-layout">

            <!-- ฝั่งซ้าย: ฟอร์มเพิ่มอัลบั้มใหม่ -->
            <div class="form-card">
                <h3>➕ อัลบั้มใหม่</h3>
                <form id="albumForm">
                    <div class="form-group">
                        <label>วันที่ปฏิบัติงาน</label>
                        <input type="text" id="albumDate" class="form-control" placeholder="27/12/2569" required>
                    </div>
                    <div class="form-group">
                        <label>ชื่องาน / หัวข้ออัลบั้ม</label>
                        <input type="text" id="albumTitle" class="form-control" placeholder="SOD-260123 TR.1234 S/N6311234" required>
                    </div>
                    <div class="form-group">
                        <label>รายละเอียด</label>
                        <textarea id="albumDesc" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>เลือกรูปภาพ (จากมือถือ / คอมพิวเตอร์)</label>
                        <input type="file" id="albumImageFile" class="form-control" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn-submit">💾 บันทึก</button>
                </form>
            </div>

            <!-- ฝั่งขวา: รายการอัลบั้มงาน -->
            <div class="content-section">
                <div class="section-title">📂 รายการอัลบั้มงาน</div>
                <div class="album-grid" id="albumContainer">
                    <!-- ข้อมูลอัลบั้มจะแสดงผลตรงนี้ -->
                </div>
            </div>

        </div>

        <div class="footer">
            ระบบบันทึกข้อมูลอัตโนมัติ • QTC Energy PCL.
        </div>
    </div>

    <script>
        let albums = JSON.parse(localStorage.getItem('qtc_smart_albums_v2')) || [];

        const albumContainer = document.getElementById('albumContainer');
        const albumForm = document.getElementById('albumForm');

        function renderAlbums() {
            albumContainer.innerHTML = '';
            if(albums.length === 0) {
                albumContainer.innerHTML = '<p style="color: #64748b; text-align: center; grid-column: span 2; padding: 2rem;">ยังไม่มีอัลบั้มบันทึกงาน กรุณาเพิ่มข้อมูลด้านซ้ายครับ</p>';
                return;
            }
            albums.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'album-card';
                card.innerHTML = `
                    <div class="album-header-bar">
                        <span>📅 ${item.date}</span>
                        <span style="color: #34d399;">● เสร็จสิ้น</span>
                    </div>
                    ${item.image ? `<img src="${item.image}" alt="Work Image" class="album-img-preview">` : ''}
                    <div class="album-body">
                        <div>
                            <div class="album-title">${item.title}</div>
                            <div class="album-desc">${item.desc}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteAlbum(${index})">🗑️ ลบอัลบั้มนี้</button>
                    </div>
                `;
                albumContainer.appendChild(card);
            });
        }

        albumForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('albumImageFile');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const newAlbum = {
                        date: document.getElementById('albumDate').value,
                        title: document.getElementById('albumTitle').value,
                        desc: document.getElementById('albumDesc').value,
                        image: event.target.result // แปลงรูปเป็น Base64
                    };

                    albums.unshift(newAlbum);
                    localStorage.setItem('qtc_smart_albums_v2', JSON.stringify(albums));
                    renderAlbums();
                    albumForm.reset();
                };
                reader.readAsDataURL(file);
            }
        });

        function deleteAlbum(index) {
            if(confirm('ต้องการลบอัลบั้มนี้ใช่หรือไม่?')) {
                albums.splice(index, 1);
                localStorage.setItem('qtc_smart_albums_v2', JSON.stringify(albums));
                renderAlbums();
            }
        }

        renderAlbums();
    </script>
</body>
</html>
