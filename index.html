<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Monitoring Box - Work Archives</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 1rem; }
        
        .container { max-width: 900px; margin: 0 auto; }

        .header-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.2rem;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        @media(min-width: 768px) {
            .header-card { flex-direction: row; text-align: left; padding: 1.5rem; }
        }

        .character-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .header-info .company-tag {
            font-size: 0.7rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .header-info h1 { font-size: 1.15rem; color: #f8fafc; margin-bottom: 0.2rem; }
        .header-info .creator-text { font-size: 0.85rem; color: #ffffff; font-weight: 500; margin-bottom: 0.3rem; }
        .header-info p { font-size: 0.8rem; color: #94a3b8; }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
            border-left: 4px solid #38bdf8;
            padding-left: 0.5rem;
        }

        .btn-add {
            background-color: #10b981;
            color: white;
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
            transition: background-color 0.2s;
        }
        .btn-add:hover { background-color: #059669; }

        .filter-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            overflow-x: auto;
            padding-bottom: 0.3rem;
        }

        .filter-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn:hover { color: #fff; border-color: #475569; }
        .filter-btn.active { background-color: #38bdf8; color: #0f172a; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }

        .album-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media(min-width: 650px) {
            .album-grid { grid-template-columns: 1fr 1fr; }
        }

        .album-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .album-header-bar {
            background-color: #0f172a;
            padding: 0.6rem 0.9rem;
            font-size: 0.82rem;
            color: #f8fafc;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            word-break: break-all;
        }

        .badge-tag { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
        .badge-smart { background-color: #0284c7; color: #fff; }
        .badge-free { background-color: #d97706; color: #fff; }

        .album-images-container {
            padding: 0.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 0.4rem;
            max-height: 200px;
            overflow-y: auto;
            background-color: #0f172a;
        }

        .thumb-img {
            width: 100%;
            height: 75px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #475569;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .thumb-img:hover { transform: scale(1.03); border-color: #38bdf8; }

        .album-footer {
            padding: 0.55rem 0.8rem;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: right;
            border-top: 1px solid #334155;
            margin-top: auto;
        }

        /* Modal สำหรับดูรูปภาพ */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            touch-action: pan-y;
        }

        .modal-content-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 6px;
            object-fit: contain;
            user-select: none;
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 25px;
            color: #fff; font-size: 2.2rem; font-weight: 300;
            cursor: pointer;
            z-index: 1000;
            background: none;
            border: none;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal-close:hover { color: #38bdf8; }

        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 3rem;
            cursor: pointer;
            padding: 1rem;
            transition: color 0.2s;
            z-index: 1000;
            user-select: none;
        }
        .modal-nav-btn:hover { color: #38bdf8; }
        .nav-prev { left: 10px; }
        .nav-next { right: 10px; }

        @media(min-width: 768px) {
            .nav-prev { left: 30px; }
            .nav-next { right: 30px; }
        }

        .modal-counter {
            color: #94a3b8;
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .loading-view {
            text-align: center;
            color: #38bdf8;
            padding: 3rem;
            font-size: 0.95rem;
        }

        .footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- การ์ดหัวข้อและชื่อผู้จัดทำด้านบน -->
        <div class="header-card">
            <img src="big.jpeg" alt="Smart Monitoring Box Mascot" class="character-img">
            <div class="header-info">
                <div class="company-tag">QTC Energy PCL. • Rayong</div>
                <h1>Smart Monitoring Box</h1>
                <div class="creator-text">ผู้จัดทำ: Natee Intharam</div>
                <p>คลังจัดเก็บอัลบั้มภาพถ่ายสำหรับตรวจสอบการปฏิบัติงาน</p>
            </div>
        </div>

        <div class="top-action-bar">
            <div class="section-title">📂 รายการอัลบั้มงาน</div>
            <a href="add.html" class="btn-add">➕ เพิ่มอัลบั้มใหม่</a>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCategory('all', this)">🌐 ทั้งหมด (<span id="countAll">0</span>)</button>
            <button class="filter-btn" onclick="filterCategory('Smart', this)">⚡ Smart (<span id="countSmart">0</span>)</button>
            <button class="filter-btn" onclick="filterCategory('Smartแถม', this)">🎁 Smart (แถม) (<span id="countFree">0</span>)</button>
        </div>
        
        <div id="loadingView" class="loading-view">⏳ กำลังโหลดอัลบั้มจาก Google Drive...</div>

        <div class="album-grid" id="albumContainer"></div>

        <div class="footer">
            ระบบบันทึกข้อมูลอัตโนมัติ • QTC Energy PCL.
        </div>
    </div>

    <!-- Modal สำหรับดูรูปภาพ -->
    <div id="imageModal" class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <button class="modal-nav-btn nav-prev" onclick="prevImage()">&#10094;</button>
        
        <div class="modal-content-wrapper" id="modalWrapper">
            <img class="modal-content" id="modalImg">
        </div>

        <button class="modal-nav-btn nav-next" onclick="nextImage()">&#10095;</button>
        <div id="modalCounter" class="modal-counter">1 / 1</div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyASRCNjL0XhJBWJyNkSRsqiF17vCEXWSX00i59xIaKpY5tWBY448bl0t1P7Fyq0d1Xgg/exec";

        const loadingView = document.getElementById('loadingView');
        const albumContainer = document.getElementById('albumContainer');

        let allAlbumsData = [];
        let currentFilter = 'all';

        let currentAlbumImages = [];
        let currentIndex = 0;

        async function fetchAlbums() {
            try {
                const response = await fetch(SCRIPT_URL);
                allAlbumsData = await response.json();
                
                loadingView.style.display = 'none';

                const smartCount = allAlbumsData.filter(item => item.category === "Smart").length;
                const freeCount = allAlbumsData.filter(item => item.category === "Smartแถม").length;

                document.getElementById('countAll').innerText = allAlbumsData.length;
                document.getElementById('countSmart').innerText = smartCount;
                document.getElementById('countFree').innerText = freeCount;

                renderAlbums();

            } catch (error) {
                loadingView.innerText = 'เกิดข้อผิดพลาดในการโหลดข้อมูลจาก Google Drive';
            }
        }

        function renderAlbums() {
            albumContainer.innerHTML = '';

            let filteredAlbums = allAlbumsData;
            if (currentFilter !== 'all') {
                filteredAlbums = allAlbumsData.filter(item => item.category === currentFilter);
            }

            if (!filteredAlbums || filteredAlbums.length === 0) {
                albumContainer.innerHTML = '<p style="color: #64748b; text-align: center; padding: 2rem; grid-column: 1/-1;">ไม่พบรายการอัลบั้มในหมวดหมู่นี้</p>';
                return;
            }

            filteredAlbums.forEach(item => {
                const card = document.createElement('div');
                card.className = 'album-card';

                const isFree = item.category === "Smartแถม";
                const badgeText = isFree ? "Smart (แถม)" : "Smart";
                const badgeClass = isFree ? "badge-free" : "badge-smart";

                let imagesHtml = '';
                if (item.images && item.images.length > 0) {
                    imagesHtml = `<div class="album-images-container">`;
                    item.images.forEach((imgSrc, imgIndex) => {
                        imagesHtml += `<img src="${imgSrc}" class="thumb-img" onclick='openModal(${JSON.stringify(item.images)}, ${imgIndex})' alt="Work Photo">`;
                    });
                    imagesHtml += `</div>`;
                }

                card.innerHTML = `
                    <div class="album-header-bar">
                        <span>📅 ${item.folderName}</span>
                        <span class="badge-tag ${badgeClass}">${badgeText}</span>
                    </div>
                    ${imagesHtml}
                    <div class="album-footer">
                        รูปภาพทั้งหมด: <span style="color: #34d399; font-weight: 600;">${item.images.length} รูป</span>
                    </div>
                `;
                albumContainer.appendChild(card);
            });
        }

        function filterCategory(category, btnElement) {
            currentFilter = category;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderAlbums();
        }

        function openModal(imagesArray, index) {
            currentAlbumImages = imagesArray;
            currentIndex = index;
            updateModalImage();
            document.getElementById('imageModal').style.display = 'flex';
        }

        function updateModalImage() {
            const modalImg = document.getElementById('modalImg');
            const modalCounter = document.getElementById('modalCounter');
            
            modalImg.src = currentAlbumImages[currentIndex];
            modalCounter.innerText = `${currentIndex + 1} / ${currentAlbumImages.length}`;
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % currentAlbumImages.length;
            updateModalImage();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + currentAlbumImages.length) % currentAlbumImages.length;
            updateModalImage();
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        let touchStartX = 0;
        let touchEndX = 0;
        const modalWrapper = document.getElementById('modalWrapper');

        modalWrapper.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        modalWrapper.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) nextImage();
            if (touchEndX > touchStartX + threshold) prevImage();
        }

        document.addEventListener('keydown', function(e) {
            const modal = document.getElementById('imageModal');
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeModal();
            }
        });

        fetchAlbums();
    </script>
</body>
</html>
