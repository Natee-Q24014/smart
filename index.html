<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Monitoring Box - Work Archives</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 1.5rem 1rem; }
        
        .container { max-width: 900px; margin: 0 auto; }

        .header-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        @media(min-width: 768px) {
            .header-card { flex-direction: row; text-align: left; }
        }

        .character-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .header-info .company-tag {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .header-info h1 { font-size: 1.3rem; color: #f8fafc; margin-bottom: 0.3rem; }
        .header-info p { font-size: 0.85rem; color: #94a3b8; }

        .nav-bar {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 600;
            border-left: 4px solid #38bdf8;
            padding-left: 0.5rem;
        }

        .btn-add {
            background-color: #10b981;
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
            transition: background-color 0.2s;
        }

        .btn-add:hover { background-color: #059669; }

        .album-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .album-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .album-header-bar {
            background-color: #0f172a;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .badge-smart { background-color: #0284c7; color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; }
        .badge-free { background-color: #d97706; color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; }

        .album-images-container {
            padding: 0.8rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.5rem;
            background-color: #0f172a;
            max-height: 250px;
            overflow-y: auto;
        }

        .thumb-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #475569;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .thumb-img:hover {
            transform: scale(1.03);
            border-color: #38bdf8;
        }

        .album-body {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .album-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        /* Modal สำหรับกดดูรูปขนาดใหญ่ */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            border: 2px solid #38bdf8;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff; font-size: 2rem; font-weight: bold;
            cursor: pointer;
        }

        .loading-view {
            text-align: center;
            color: #38bdf8;
            padding: 3rem;
            font-size: 1rem;
        }

        .footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <img src="big.jpeg" alt="Smart Monitoring Box Mascot" class="character-img">
            <div class="header-info">
                <div class="company-tag">QTC Energy PCL. • Rayong</div>
                <h1>Smart Monitoring Box - Work Archives</h1>
                <p>คลังจัดเก็บอัลบั้มภาพถ่ายสำหรับตรวจสอบการปฏิบัติงาน</p>
            </div>
        </div>

        <div class="nav-bar">
            <div class="section-title">📂 รายการอัลบั้มงานทั้งหมดจาก Google Drive</div>
            <a href="add.html" class="btn-add">➕ เพิ่มอัลบั้มใหม่</a>
        </div>
        
        <div id="loadingView" class="loading-view">⏳ กำลังโหลดอัลบั้มจาก Google Drive...</div>
        <div class="album-grid" id="albumContainer"></div>

        <div class="footer">
            ระบบบันทึกข้อมูลอัตโนมัติ • QTC Energy PCL.
        </div>
    </div>

    <!-- Modal สำหรับขยายรูปดู -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        // 👉 นำ URL ของ Google Apps Script มาวางตรงนี้
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyASRCNjL0XhJBWJyNkSRsqiF17vCEXWSX00i59xIaKpY5tWBY448bl0t1P7Fyq0d1Xgg/exec";

        const albumContainer = document.getElementById('albumContainer');
        const loadingView = document.getElementById('loadingView');

        async function fetchAlbums() {
            try {
                const response = await fetch(SCRIPT_URL);
                const albums = await response.json();
                
                loadingView.style.display = 'none';
                albumContainer.innerHTML = '';

                if (!albums || albums.length === 0) {
                    albumContainer.innerHTML = '<p style="color: #64748b; text-align: center; padding: 2rem;">ยังไม่มีอัลบั้มงานใน Google Drive</p>';
                    return;
                }

                albums.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'album-card';
                    
                    const badgeClass = (item.category === "Smartแถม") ? "badge-free" : "badge-smart";
                    
                    let imagesHtml = '';
                    if (item.images && item.images.length > 0) {
                        imagesHtml = `<div class="album-images-container">`;
                        item.images.forEach(imgSrc => {
                            imagesHtml += `<img src="${imgSrc}" class="thumb-img" onclick="openModal('${imgSrc}')" alt="Work Photo">`;
                        });
                        imagesHtml += `</div>`;
                    }

                    card.innerHTML = `
                        <div class="album-header-bar">
                            <span>📁 ${item.folderName}</span>
                            <span class="${badgeClass}">${item.category}</span>
                        </div>
                        ${imagesHtml}
                        <div class="album-body">
                            <div class="album-title">รูปภาพทั้งหมดในอัลบั้ม</div>
                            <span style="color: #34d399; font-size: 0.85rem;">● ${item.images.length} รูป</span>
                        </div>
                    `;
                    albumContainer.appendChild(card);
                });

            } catch (error) {
                loadingView.innerText = 'เกิดข้อผิดพลาดในการโหลดข้อมูลจาก Google Drive';
            }
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'flex';
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        fetchAlbums();
    </script>
</body>
</html>
