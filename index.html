<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รักษ์โลก 7 ภารกิจ</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #121815; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .login-card {
            background-color: #1c2621;
            border: 1px solid #2a3d33;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .icon-logo {
            width: 70px;
            height: 70px;
            background-color: #11291d;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem auto;
            font-size: 2rem;
            color: #22c55e;
            border: 2px solid #1e3a29;
        }

        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f0fdf4; }
        p { font-size: 0.9rem; color: #9ca3af; margin-bottom: 2rem; }

        .form-group { text-align: left; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; color: #d1d5db; margin-bottom: 0.5rem; }
        
        input[type="text"] {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: #121815;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #22c55e;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: #15803d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-logo">🌍</div>
        <h1>รักษ์โลก 7 ภารกิจ 🌱</h1>
        <p>ทำภารกิจเล็กๆ เปลี่ยนโลกให้ดีขึ้น</p>

        <form action="#" method="GET">
            <div class="form-group">
                <label for="emp_id">รหัสพนักงาน</label>
                <input type="text" id="emp_id" placeholder="กรอกรหัสพนักงาน" required>
            </div>
            <button type="submit" class="btn-submit">➔ เข้าสู่ระบบ</button>
        </form>
    </div>

</body>
</html>
