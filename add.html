<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มอัลบั้มใหม่ - Smart Monitoring Box</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: #262c38; 
            background-image: 
                radial-gradient(at 10% 20%, rgba(14, 165, 233, 0.1) 0px, transparent 40%),
                radial-gradient(at 90% 80%, rgba(56, 189, 248, 0.07) 0px, transparent 40%),
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #e2e8f0; 
            min-height: 100vh; 
            padding: 1rem; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container { width: 100%; max-width: 500px; }

        .form-card {
            background-color: #323b4d;
            border: 1px solid #434e63;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .form-title {
            font-size: 1.15rem;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-left: 4px solid #38bdf8;
            padding-left: 0.6rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .radio-group {
            display: flex;
            gap: 0.8rem;
        }

        .radio-btn {
            flex: 1;
            background-color: #262c38;
            border: 1px solid #4d5b73;
            color: #94a3b8;
            padding: 0.7rem;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .radio-btn.active {
            background-color: #0369a1;
            color: #e0f2fe;
            border-color: #38bdf8;
            box-shadow: 0 4px 12px rgba(3, 105, 161, 0.3);
        }

        input[type="date"], 
        input[type="text"] {
            width: 100%;
            background-color: #262c38;
            color: #f8fafc;
            border: 1px solid #4d5b73;
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }

        input[type="date"]::-webkit-datetime-edit-year-field { position: relative; padding: 0 2px; }
        input[type="date"]::-webkit-datetime-edit-month-field { position: relative; padding: 0 2px; }
        input[type="date"]::-webkit-datetime-edit-day-field { position: relative; padding: 0 2px; }

        .file-upload-box {
            border: 2px dashed #4d5b73;
            padding: 0.6rem;
            border-radius: 10px;
            text-align: center;
            background-color: #262c38;
            cursor: pointer;
            transition: border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
        .file-upload-box:hover { border-color: #38bdf8; }
        
        input[type="file"] { display: none; }

        .file-label-text {
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.7rem;
            background-color: rgba(56, 189, 248, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            white-space: nowrap;
        }

        .file-count-text {
            font-size: 0.78rem;
            color: #94a3b8;
            white-space: nowrap;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 0.6rem;
            margin-top: 0.8rem;
            max-height: 180px;
            overflow-y: auto;
        }

        .preview-item {
            position: relative;
            width: 100%;
            height: 75px;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #4d5b73;
        }

        .btn-remove-single {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn-remove-single:hover { background-color: #dc2626; }

        .btn-action-row {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-back { background-color: #3e495e; color: #cbd5e1; border: 1px solid #4d5b73; }
        .btn-back:hover { background-color: #4d5b73; color: #fff; }

        .btn-submit { background-color: #0f766e; color: #e2e8f0; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3); }
        .btn-submit:hover { background-color: #115e59; }

        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(18, 22, 30, 0.85);
            justify-content: center;
            align-items: center;
        }

        .dialog-box {
            background-color: #323b4d;
            border: 1px solid #434e63;
            padding: 1.8rem;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #434e63;
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.8rem auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <div class="form-title">
                <span>➕ เพิ่มอัลบั้มภาพถ่ายใหม่</span>
            </div>

            <form id="uploadForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>หมวดหมู่ผลงาน:</label>
                    <div class="radio-group">
                        <div id="btnSmart" class="radio-btn active" onclick="setCategory('Smart')">Smart</div>
                        <div id="btnFree" class="radio-btn" onclick="setCategory('Smartแถม')">Smart (แถม)</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>วันที่ปฏิบัติงาน (วัน/เดือน/ปี):</label>
                    <input type="date" id="workDate" style="direction: ltr;" required>
                </div>

                <div class="form-group">
                    <label>ชื่อหัวข้ออัลบั้ม:</label>
                    <input type="text" id="folderName" placeholder="เช่น SOD123456 S/N6312345 TR100" required>
                </div>

                <div class="form-group">
                    <label>เลือกรูปภาพ:</label>
                    <div class="file-upload-box" onclick="document.getElementById('imageFiles').click()">
                        <span class="file-label-text">📁 เลือกรูปภาพ</span>
                        <span id="fileCountText" class="file-count-text">ยังไม่ได้เลือกรูปภาพ</span>
                    </div>
                    <input type="file" id="imageFiles" multiple accept="image/*" onchange="previewImages(event)">
                    
                    <div id="previewContainer" class="preview-container"></div>
                </div>

                <div class="btn-action-row">
                    <a href="index.html" class="btn btn-back">⬅️ กลับหน้าหลัก</a>
                    <button type="submit" class="btn btn-submit">💾 บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <div id="loadingModal" class="modal">
        <div class="dialog-box">
            <div id="spinnerBox" class="loading-spinner"></div>
            <h3 id="modalTitle" style="color: #38bdf8; margin-bottom: 0.4rem; font-size: 1.1rem;">กำลังอัปโหลดข้อมูล...</h3>
            <p id="modalDesc" style="font-size: 0.82rem; color: #94a3b8; margin-bottom: 1.2rem;">กรุณารอสักครู่ ระบบกำลังส่งรูปภาพไปยัง Google Drive</p>
            <button id="modalCloseBtn" class="btn btn-submit" style="display: none; width: 100%;" onclick="closeModalAndRedirect()">ตกลง</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyASRCNjL0XhJBWJyNkSRsqiF17vCEXWSX00i59xIaKpY5tWBY448bl0t1P7Fyq0d1Xgg/exec";
        
        let selectedCategory = 'Smart';
        let selectedFilesArray = [];

        document.getElementById('workDate').valueAsDate = new Date();

        function setCategory(cat) {
            selectedCategory = cat;
            if(cat === 'Smart') {
                document.getElementById('btnSmart').classList.add('active');
                document.getElementById('btnFree').classList.remove('active');
            } else {
                document.getElementById('btnFree').classList.add('active');
                document.getElementById('btnSmart').classList.remove('active');
            }
        }

        function previewImages(event) {
            const files = Array.from(event.target.files);
            selectedFilesArray = selectedFilesArray.concat(files);
            updatePreviewUI();
        }

        function removeSelectedFile(index) {
            selectedFilesArray.splice(index, 1);
            updatePreviewUI();
        }

        function updatePreviewUI() {
            const container = document.getElementById('previewContainer');
            const fileCountText = document.getElementById('fileCountText');
            container.innerHTML = '';

            if (selectedFilesArray.length === 0) {
                fileCountText.innerText = "ยังไม่ได้เลือกรูปภาพ";
                return;
            }

            fileCountText.innerText = `เลือกแล้ว ${selectedFilesArray.length} รูป`;

            selectedFilesArray.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'preview-item';
                    itemDiv.innerHTML = `
                        <img src="${e.target.result}" class="preview-img">
                        <button type="button" class="btn-remove-single" onclick="removeSelectedFile(${index})" title="ลบรูปนี้">✕</button>
                    `;
                    container.appendChild(itemDiv);
                }
                reader.readAsDataURL(file);
            });
        }

        async function handleFormSubmit(event) {
            event.preventDefault();

            if (selectedFilesArray.length === 0) {
                alert("กรุณาเลือกรูปภาพอย่างน้อย 1 รูป");
                return;
            }

            const rawDate = document.getElementById('workDate').value;
            const folderName = document.getElementById('folderName').value.trim();

            if (!rawDate || !folderName) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                return;
            }

            document.getElementById('modalTitle').innerText = "กำลังอัปโหลดข้อมูล...";
            document.getElementById('modalDesc').innerText = `กำลังประมวลผล (${selectedFilesArray.length} รูป)`;
            document.getElementById('spinnerBox').style.display = 'block';
            document.getElementById('modalCloseBtn').style.display = 'none';
            document.getElementById('loadingModal').style.display = 'flex';

            try {
                let base64Images = [];
                for (let file of selectedFilesArray) {
                    let base64 = await resizeAndCompressImage(file);
                    base64Images.push(base64);
                }

                const payload = {
                    action: 'create',
                    optionType: selectedCategory,
                    month: rawDate,
                    folderName: folderName,
                    images: base64Images
                };

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                document.getElementById('spinnerBox').style.display = 'none';
                if (result.status === "success") {
                    document.getElementById('modalTitle').innerText = "✅ บันทึกสำเร็จ!";
                    document.getElementById('modalDesc').innerText = "อัปโหลดอัลบั้มภาพเข้าสู่ระบบเรียบร้อยแล้ว";
                } else {
                    document.getElementById('modalTitle').innerText = "❌ เกิดข้อผิดพลาด";
                    document.getElementById('modalDesc').innerText = result.message || "ไม่สามารถบันทึกข้อมูลได้";
                }
                document.getElementById('modalCloseBtn').style.display = 'block';

            } catch (err) {
                document.getElementById('spinnerBox').style.display = 'none';
                document.getElementById('modalTitle').innerText = "❌ เกิดข้อผิดพลาด";
                document.getElementById('modalDesc').innerText = "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้";
                document.getElementById('modalCloseBtn').style.display = 'block';
            }
        }

        function resizeAndCompressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1200;
                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    }
                }
            });
        }

        function closeModalAndRedirect() {
            document.getElementById('loadingModal').style.display = 'none';
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
