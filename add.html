<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มอัลบั้มใหม่ - Smart Monitoring Box</title>
    
    <!-- โหลดไลบรารี JSZip สำหรับรองรับการบีบอัด -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: #262c38; 
            background-image: 
                radial-gradient(at 10% 20%, rgba(14, 165, 233, 0.1) 0px, transparent 40%),
                radial-gradient(at 90% 80%, rgba(56, 189, 248, 0.07) 0px, transparent 40%),
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #e2e8f0; 
            min-height: 100vh; 
            padding: 1rem; 
        }
        
        .container { max-width: 800px; margin: 0 auto; }

        .card {
            background-color: #323b4d;
            border: 1px solid #434e63;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
        }

        .header-title {
            font-size: 1.3rem;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            color: #cbd5e1;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .form-input, .form-select {
            width: 100%;
            background-color: #262c38;
            color: #f8fafc;
            border: 1px solid #4d5b73;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-select:focus { border-color: #38bdf8; }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.6rem;
            margin-top: 0.8rem;
            max-height: 280px;
            overflow-y: auto;
            padding: 0.2rem;
        }

        .preview-item {
            position: relative;
            height: 90px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #4d5b73;
            background: #262c38;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary { background-color: #0284c7; color: #fff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .btn-primary:hover { background-color: #0369a1; }
        .btn-secondary { background-color: #3e495e; color: #cbd5e1; border: 1px solid #4d5b73; }
        .btn-secondary:hover { background-color: #4d5b73; color: #fff; }

        /* Modal แจ้งเตือนแบบอัตโนมัติ (หายเองใน 2 วินาที) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1020;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(18, 22, 30, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .dialog-box {
            background-color: #323b4d;
            border: 1px solid #434e63;
            padding: 1.5rem;
            border-radius: 14px;
            width: 90%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .loading-spinner {
            width: 38px;
            height: 38px;
            border: 3px solid #434e63;
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.8rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer { text-align: center; margin-top: 2rem; font-size: 0.75rem; color: #6b7280; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header-title">➕ เพิ่มอัลบั้มภาพใหม่</div>
            <div class="header-desc">อัปโหลดรูปภาพ ระบบจะดึงวันที่จากรูปภาพมาตั้งเป็นหัวข้อให้อัตโนมัติ (สามารถพิมพ์แก้หรือพิมพ์เพิ่มเติมได้)</div>

            <form id="uploadForm" onsubmit="handleUpload(event)">
                <div class="form-group">
                    <label class="form-label">📁 หัวข้ออัลบั้มงาน (แก้ไขหรือพิมพ์เพิ่มได้)</label>
                    <input type="text" id="folderNameInput" class="form-input" placeholder="เลือกรูปภาพก่อน..." required style="color: #38bdf8; font-weight: 700;">
                </div>

                <div class="form-group">
                    <label class="form-label">⚡ เลือกหมวดหมู่ระบบ</label>
                    <select id="optionTypeSelect" class="form-select">
                        <option value="Smart">Smart</option>
                        <option value="Smartแถม">Smart (แถม)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">📷 เลือกรูปภาพปฏิบัติงาน (หลายรูปได้)</label>
                    <input type="file" id="imagesInput" multiple accept="image/*" class="form-input" style="padding: 0.5rem;" onchange="previewAndExtractDate(event)" required>
                    <div id="previewGrid" class="preview-grid"></div>
                </div>

                <div class="btn-group">
                    <a href="index.html" class="btn btn-secondary">⬅️ กลับหน้าหลัก</a>
                    <button type="submit" class="btn btn-primary">🚀 บันทึกและอัปโหลด</button>
                </div>
            </form>
        </div>

        <div class="footer">
            ระบบบันทึกข้อมูลอัตโนมัติ • QTC Energy PCL.
        </div>
    </div>

    <!-- Modal สถานะการทำงาน -->
    <div id="loadingModal" class="modal">
        <div class="dialog-box">
            <div class="loading-spinner"></div>
            <h3 id="loadingTitle" style="color: #38bdf8; margin-bottom: 0.2rem; font-size: 1rem;">กำลังอัปโหลด</h3>
            <p id="loadingDesc" style="font-size: 0.78rem; color: #94a3b8;">โปรดรอสักครู่...</p>
        </div>
    </div>

    <!-- Toast แจ้งเตือนแบบอัตโนมัติ (หายเองใน 2 วินาที) -->
    <div id="customToastModal" class="modal" style="z-index: 1020;">
        <div class="dialog-box" style="max-width: 280px; padding: 1.2rem;">
            <h3 id="toastTitle" style="color: #38bdf8; margin-bottom: 0.2rem; font-size: 1rem;">แจ้งเตือน</h3>
            <p id="toastDesc" style="font-size: 0.8rem; color: #94a3b8; line-height: 1.4; margin-bottom: 0;">ดำเนินการเรียบร้อย</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5dv5PSxnr724CTabIpF3GbRWFkId62BcuDj3IVcpCKleaX4HDnV8UFIWjIk-Sk-Eu1w/exec";

        let extractedMonthStr = "";

        function showToast(title, desc, isError = false) {
            const toastModal = document.getElementById('customToastModal');
            const titleEl = document.getElementById('toastTitle');
            const descEl = document.getElementById('toastDesc');

            titleEl.innerText = title;
            titleEl.style.color = isError ? '#fca5a5' : '#38bdf8';
            descEl.innerText = desc;

            toastModal.style.display = 'flex';
            setTimeout(() => {
                toastModal.style.display = 'none';
            }, 2000);
        }

        function previewAndExtractDate(event) {
            const files = event.target.files;
            const previewGrid = document.getElementById('previewGrid');
            const folderNameInput = document.getElementById('folderNameInput');
            previewGrid.innerHTML = '';

            if (!files || files.length === 0) {
                folderNameInput.value = '';
                return;
            }

            // ดึงวันที่จากรูปแรกสุดที่เลือก (File Last Modified Date)
            let fileDate = new Date(files[0].lastModified);
            if (isNaN(fileDate.getTime())) {
                fileDate = new Date(); // ถ้าดึงไม่ได้ใช้วันที่ปัจจุบัน
            }

            let day = String(fileDate.getDate()).padStart(2, '0');
            let month = String(fileDate.getMonth() + 1).padStart(2, '0');
            let year = fileDate.getFullYear();

            // รูปแบบเดือนสำหรับบันทึกระบบ (DD/MM/YYYY)
            extractedMonthStr = `${day}/${month}/${year}`;
            
            // ตั้งชื่อหัวข้ออัตโนมัติ และปล่อยให้ผู้ใช้พิมพ์ต่อได้
            folderNameInput.value = `งานปฏิบัติการ วันที่ ${extractedMonthStr} `;

            // แสดงตัวอย่างรูปภาพ
            for (let file of files) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `<img src="${e.target.result}">`;
                    previewGrid.appendChild(div);
                }
                reader.readAsDataURL(file);
            }
        }

        async function handleUpload(event) {
            event.preventDefault();
            const files = document.getElementById('imagesInput').files;
            const folderName = document.getElementById('folderNameInput').value;
            const optionType = document.getElementById('optionTypeSelect').value;

            if (files.length === 0) {
                showToast("แจ้งเตือน", "กรุณาเลือกรูปภาพอย่างน้อย 1 รูป", true);
                return;
            }

            const loadingModal = document.getElementById('loadingModal');
            document.getElementById('loadingTitle').innerText = "กำลังอัปโหลดรูปภาพ";
            document.getElementById('loadingDesc').innerText = `กำลังประมวลผล ${files.length} รูป...`;
            loadingModal.style.display = 'flex';

            try {
                let base64Images = [];
                for (let file of files) {
                    let b64 = await fileToBase64(file, 1200);
                    base64Images.push(b64);
                }

                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'upload',
                        folderName: folderName,
                        optionType: optionType,
                        month: extractedMonthStr,
                        images: base64Images
                    })
                });

                let result = await response.json();
                loadingModal.style.display = 'none';

                if (result.status === "success") {
                    showToast("สำเร็จ", "บันทึกอัลบั้มเรียบร้อยแล้ว!");
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                } else {
                    showToast("ผิดพลาด", result.message, true);
                }
            } catch (err) {
                loadingModal.style.display = 'none';
                showToast("ผิดพลาด", "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้", true);
            }
        }

        function fileToBase64(file, maxDim) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
                        else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
                    };
                };
            });
        }
    </script>
</body>
</html>
