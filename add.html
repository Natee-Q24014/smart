<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มอัลบั้มใหม่ - Smart Monitoring Box</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: #262c38; 
            background-image: 
                radial-gradient(at 10% 20%, rgba(14, 165, 233, 0.1) 0px, transparent 40%),
                radial-gradient(at 90% 80%, rgba(56, 189, 248, 0.07) 0px, transparent 40%),
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #e2e8f0; 
            min-height: 100vh; 
            padding: 1rem; 
        }
        
        .container { max-width: 600px; margin: 0 auto; }

        .form-card {
            background-color: #323b4d;
            border: 1px solid #434e63;
            padding: 1.2rem;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .form-title {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #434e63;
            padding-bottom: 0.6rem;
        }

        .form-group { margin-bottom: 0.9rem; }
        .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; font-weight: 600; margin-bottom: 0.3rem; }

        .option-group { display: flex; gap: 0.5rem; }
        .option-btn {
            flex: 1; padding: 0.5rem; background-color: #262c38; border: 1px solid #4d5b73;
            color: #94a3b8; font-weight: 700; font-size: 0.85rem; border-radius: 8px; cursor: pointer; text-align: center;
        }
        .option-btn.active { background-color: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: #38bdf8; }

        .form-input {
            width: 100%; background-color: #262c38; color: #f8fafc; border: 1px solid #4d5b73;
            padding: 0.55rem 0.8rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; outline: none;
        }
        .form-input:focus { border-color: #38bdf8; }

        .file-upload-box {
            background-color: #262c38; border: 2px dashed #4d5b73; border-radius: 8px; padding: 1rem;
            text-align: center; cursor: pointer; color: #38bdf8; font-weight: 600; font-size: 0.85rem;
        }
        .file-upload-box:hover { border-color: #38bdf8; background-color: rgba(56, 189, 248, 0.03); }

        .preview-grid {
            display: none; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.6rem;
            max-height: 220px; overflow-y: auto; padding-right: 2px;
        }
        .preview-item { position: relative; width: 100%; height: 85px; border-radius: 6px; overflow: hidden; border: 1px solid #4d5b73; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .img-date-tag {
            position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7);
            color: #38bdf8; font-size: 0.55rem; font-weight: 700; text-align: center; padding: 1px 0;
        }
        .btn-remove-img {
            position: absolute; top: 3px; right: 3px; background: rgba(239, 68, 68, 0.8); color: #fff;
            border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 0.75rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-action-row { display: flex; gap: 0.6rem; margin-top: 1.2rem; }
        .btn {
            flex: 1; padding: 0.6rem; border-radius: 8px; font-size: 0.85rem; font-weight: 700; text-align: center; cursor: pointer; text-decoration: none; border: none;
        }
        .btn-back { background-color: #3e495e; color: #e2e8f0; border: 1px solid #4d5b73; }
        .btn-submit { background-color: #0f766e; color: #e2e8f0; }
        .btn-submit:hover { background-color: #115e59; }

        /* --- Modal ดูรูปตัวอย่าง พร้อมระบบซูมและปัดเลื่อนซ้าย-ขวา --- */
        #imageModal {
            display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(12, 16, 24, 0.96); flex-direction: column; overflow: hidden; touch-action: none;
        }
        .modal-top-bar { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10000; }
        .modal-close { color: #fff; font-size: 2.2rem; cursor: pointer; background: none; border: none; }
        
        .modal-content-wrapper {
            position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none;
        }
        .modal-content {
            max-width: 90vw; max-height: 80vh; border-radius: 8px; object-fit: contain;
            transform-origin: center center; cursor: grab; user-select: none; will-change: transform;
        }
        .modal-content:active { cursor: grabbing; }

        .modal-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255, 255, 255, 0.8); font-size: 2.5rem; cursor: pointer; padding: 0.8rem; z-index: 10000; }
        .nav-prev { left: 5px; } .nav-next { right: 5px; }
        .modal-counter { position: absolute; bottom: 20px; color: #94a3b8; font-size: 0.85rem; font-weight: 600; z-index: 10000; }

        .loading-modal {
            display: none; position: fixed; z-index: 1010; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(18, 22, 30, 0.85); justify-content: center; align-items: center; flex-direction: column;
        }
        .loading-dialog-box { background-color: #323b4d; border: 1px solid #434e63; padding: 1.2rem; border-radius: 12px; width: 92%; max-width: 300px; text-align: center; }
        .loading-spinner { width: 32px; height: 32px; border: 3px solid #434e63; border-top: 3px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 0.6rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .custom-toast {
            display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background-color: #323b4d; border: 1px solid #38bdf8; padding: 0.6rem 1rem; border-radius: 8px;
            z-index: 1020; font-size: 0.8rem; font-weight: 600; color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.3); align-items: center; gap: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <div class="form-title">
                <span>➕ เพิ่มอัลบั้มภาพถ่ายใหม่</span>
            </div>

            <form id="uploadForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>หมวดหมู่ผลงาน:</label>
                    <div class="option-group">
                        <div id="btnSmart" class="option-btn active" onclick="setCategory('Smart')">Smart</div>
                        <div id="btnFree" class="option-btn" onclick="setCategory('Smartแถม')">Smart (แถม)</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>ชื่อหัวข้ออัลบั้ม:</label>
                    <input type="text" id="folderNameInput" class="form-input" placeholder="เช่น SOD123456 S/N6312345 TR100" required>
                </div>

                <div class="form-group">
                    <label>เลือกรูปภาพ:</label>
                    <div class="file-upload-box" onclick="document.getElementById('imageFilesInput').click()">
                        <span>📁 เลือกรูปภาพ</span>
                        <div id="fileCountLabel" style="font-size: 0.75rem; color: #94a3b8; margin-top: 0.2rem; font-weight: 500;">ยังไม่ได้เลือกรูปภาพ</div>
                    </div>
                    <input type="file" id="imageFilesInput" multiple accept="image/*" onchange="handleFileSelect(this)" style="display:none;">
                    
                    <div id="previewGrid" class="preview-grid"></div>
                </div>

                <div class="btn-action-row">
                    <a href="index.html" class="btn btn-back">⬅️ กลับหน้าหลัก</a>
                    <button type="submit" class="btn btn-submit">💾 บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal ดูรูปตัวอย่าง รองรับทั้งซูม เลื่อน และปัดซ้ายขวา -->
    <div id="imageModal" class="loading-modal" style="background-color: rgba(12, 16, 24, 0.96); justify-content: center;">
        <div class="modal-top-bar">
            <div></div>
            <button class="modal-close" onclick="closeImageModal()">&times;</button>
        </div>
        <button class="modal-nav-btn nav-prev" onclick="prevModalImage()">&#10094;</button>
        <div class="modal-content-wrapper" id="modalWrapper">
            <img class="modal-content" id="modalImageSrc" alt="Preview">
        </div>
        <button class="modal-nav-btn nav-next" onclick="nextModalImage()">&#10095;</button>
        <div id="modalCounter" class="modal-counter">1 / 1</div>
    </div>

    <div id="customToast" class="custom-toast">
        <span id="toastIcon" style="color: #34d399; font-size: 1.1rem;">✅</span>
        <span id="toastMessage">บันทึกสำเร็จ! กำลังกลับหน้าหลัก...</span>
    </div>

    <div id="loadingModal" class="loading-modal">
        <div class="loading-dialog-box">
            <div id="spinnerBox" class="loading-spinner"></div>
            <h3 id="loadingTitle" style="color: #38bdf8; margin-bottom: 0.2rem; font-size: 1rem;">กำลังอัปโหลด</h3>
            <p id="loadingDesc" style="font-size: 0.75rem; color: #94a3b8;">โปรดรอสักครู่...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://smart-album-api.smartq24014.workers.dev/";
        
        let selectedCategory = "Smart";
        let selectedFiles = [];
        let previewDataUrls = []; // เก็บ Data URL ของรูปทั้งหมดไว้ดูใน Modal

        function setCategory(cat) {
            selectedCategory = cat;
            document.getElementById('btnSmart').className = cat === 'Smart' ? 'option-btn active' : 'option-btn';
            document.getElementById('btnFree').className = cat === 'Smartแถม' ? 'option-btn active' : 'option-btn';
        }

        async function handleFileSelect(input) {
            if (!input.files || input.files.length === 0) return;
            const filesArray = Array.from(input.files);

            for (let file of filesArray) {
                await new Promise((resolve) => {
                    EXIF.getData(file, function() {
                        const exifDateTime = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
                        let shootDate = exifDateTime ? parseExifDate(exifDateTime) : (file.lastModified ? new Date(file.lastModified) : new Date());
                        file.formattedDate = formatDateTime(shootDate);
                        file.dateOnly = formatOnlyDate(shootDate);
                        resolve();
                    });
                });
                selectedFiles.push(file);
            }

            await loadAllPreviewDataUrls();
            input.value = '';
        }

        async function loadAllPreviewDataUrls() {
            previewDataUrls = [];
            for (let i = 0; i < selectedFiles.length; i++) {
                let dataUrl = await readFileAsDataURL(selectedFiles[i]);
                previewDataUrls.push(dataUrl);
            }
            renderPreview();
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("อ่านไฟล์รูปภาพไม่สำเร็จ"));
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function fileToBase64(file, maxDim = 2000) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onerror = () => reject(new Error("อ่านไฟล์รูปภาพไม่สำเร็จ"));
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onerror = () => reject(new Error("เปิดไฟล์รูปภาพไม่สำเร็จ"));
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
                        else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                        canvas.width = w; canvas.height = h;
                        const context = canvas.getContext('2d');
                        if (!context) {
                            reject(new Error("เตรียมแปลงรูปภาพไม่สำเร็จ"));
                            return;
                        }
                        context.drawImage(img, 0, 0, w, h);
                        try {
                            resolve(canvas.toDataURL('image/jpeg', 0.95).split(',')[1]);
                        } catch (err) {
                            reject(new Error("แปลงรูปภาพไม่สำเร็จ"));
                        }
                    };
                };
            });
        }

        function parseExifDate(str) {
            let p = str.split(/[:\s]/);
            return p.length >= 6 ? new Date(p[0], p[1] - 1, p[2], p[3], p[4], p[5]) : null;
        }
        function formatDateTime(d) {
            return isNaN(d?.getTime()) ? "ไม่ทราบเวลา" : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
        function formatOnlyDate(d) {
            return isNaN(d?.getTime()) ? null : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        function renderPreview() {
            const grid = document.getElementById('previewGrid');
            const fileCountLabel = document.getElementById('fileCountLabel');
            grid.innerHTML = '';
            
            if (selectedFiles.length === 0) { 
                grid.style.display = 'none'; 
                fileCountLabel.innerText = "ยังไม่ได้เลือกรูปภาพ";
                return; 
            }
            
            grid.style.display = 'grid';
            fileCountLabel.innerText = `เลือกแล้ว ${selectedFiles.length} รูป`;

            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `<img src="${previewDataUrls[index]}" onclick="openImageModal(${index})"><div class="img-date-tag">📅 ${file.formattedDate}</div><button type="button" class="btn-remove-img" onclick="removeFile(event, ${index})">&times;</button>`;
                grid.appendChild(item);
            });
        }

        async function removeFile(event, index) {
            event.stopPropagation();
            selectedFiles.splice(index, 1);
            previewDataUrls.splice(index, 1);
            renderPreview();
        }

        // --- ระบบจัดการ Modal ดูรูปตัวอย่าง พร้อมซูมและปัดเปลี่ยนรูป ---
        let activeModalIndex = 0;
        let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false;
        let initialDistance = null;
        let touchStartX = 0, touchEndX = 0;

        function openImageModal(index) {
            activeModalIndex = index;
            resetZoom();
            showImageInModal();
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function resetZoom() {
            scale = 1; pointX = 0; pointY = 0;
            updateImageTransform();
        }

        function showImageInModal() {
            const img = document.getElementById('modalImageSrc');
            resetZoom();
            img.src = previewDataUrls[activeModalIndex];
            document.getElementById('modalCounter').innerText = `${activeModalIndex + 1} / ${previewDataUrls.length}`;
        }

        function nextModalImage() {
            if (scale > 1) return; // ถ้าซูมอยู่ ให้ขยับรูปภาพแทน
            activeModalIndex = (activeModalIndex + 1) % previewDataUrls.length;
            showImageInModal();
        }

        function prevModalImage() {
            if (scale > 1) return;
            activeModalIndex = (activeModalIndex - 1 + previewDataUrls.length) % previewDataUrls.length;
            showImageInModal();
        }

        function updateImageTransform() {
            const img = document.getElementById('modalImageSrc');
            img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        const modalImg = document.getElementById('modalImageSrc');
        const modalWrapper = document.getElementById('modalWrapper');

        // ซูมด้วยเมาส์ Wheel
        modalWrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                scale = Math.min(scale * 1.2, 5);
            } else {
                scale = Math.max(scale / 1.2, 1);
                if (scale === 1) { pointX = 0; pointY = 0; }
            }
            updateImageTransform();
        });

        // รองรับการปัดนิ้วเปลี่ยนรูป (เมื่อไม่ได้ซูม) และลากเลื่อนรูป (เมื่อซูมแล้ว)
        modalWrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                if (scale === 1) {
                    touchStartX = e.touches[0].clientX;
                } else {
                    isDragging = true;
                    startX = e.touches[0].clientX - pointX;
                    startY = e.touches[0].clientY - pointY;
                }
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        modalWrapper.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1 && scale > 1) {
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                updateImageTransform();
            } else if (e.touches.length === 2 && initialDistance) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                let newScale = scale * (currentDistance / initialDistance);
                scale = Math.max(1, Math.min(newScale, 5));
                if (scale === 1) { pointX = 0; pointY = 0; }
                initialDistance = currentDistance;
                updateImageTransform();
            }
        }, { passive: true });

        modalWrapper.addEventListener('touchend', (e) => {
            if (scale === 1 && e.changedTouches.length === 1) {
                touchEndX = e.changedTouches[0].clientX;
                let threshold = 50;
                if (touchEndX < touchStartX - threshold) {
                    nextModalImage(); // ปัดซ้าย -> รูปถัดไป
                } else if (touchEndX > touchStartX + threshold) {
                    prevModalImage(); // ปัดขวา -> รูปก่อนหน้า
                }
            }
            isDragging = false;
            initialDistance = null;
        });

        // ลากเลื่อนด้วยเมาส์เมื่อซูม
        modalImg.addEventListener('mousedown', (e) => {
            if (scale > 1) {
                isDragging = true;
                startX = e.clientX - pointX;
                startY = e.clientY - pointY;
                e.preventDefault();
            }
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            updateImageTransform();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // ดับเบิลคลิกเพื่อซูมเข้า/ออกทันที
        modalImg.addEventListener('dblclick', () => {
            if (scale === 1) { scale = 2.5; } else { resetZoom(); }
            updateImageTransform();
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('customToast');
            const icon = document.getElementById('toastIcon');
            icon.innerText = isError ? '❌' : '✅';
            icon.style.color = isError ? '#f87171' : '#34d399';
            document.getElementById('toastMessage').innerText =
                isError ? `ไม่สำเร็จ: ${message}` : message;
            toast.style.borderColor = isError ? '#f87171' : '#38bdf8';
            toast.style.display = 'flex';
        }

        async function readAlbumsFromServer() {
            const response = await fetch(API_URL + "?action=getAlbums&t=" + Date.now(), { cache: 'no-store' });
            const result = await response.json();
            if (!response.ok || result.status !== "success") {
                throw new Error(result.message || "โหลดรายการอัลบั้มไม่สำเร็จ");
            }
            return result.data || [];
        }

        async function postAndConfirm(payload, isApplied) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (!response.ok || result.status !== "success") {
                throw new Error(result.message || "บันทึกข้อมูลไม่สำเร็จ");
            }
            return result;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (selectedFiles.length === 0) return alert("กรุณาเลือกรูปภาพ");
            
            let firstFileDate = selectedFiles[0].dateOnly || formatOnlyDate(new Date());
            let userTypedName = document.getElementById('folderNameInput').value.trim();
            let finalFolderName = `[${firstFileDate}] ${userTypedName}`;

            const totalFiles = selectedFiles.length;
            document.getElementById('loadingTitle').innerText = "กำลังอัปโหลด";
            document.getElementById('spinnerBox').style.display = 'block';
            document.getElementById('loadingModal').style.display = 'flex';
            document.getElementById('loadingDesc').innerText = `0/${totalFiles}`;

            try {
                let base64Images = [];
                for (let i = 0; i < selectedFiles.length; i++) {
                    base64Images.push(await fileToBase64(selectedFiles[i], 2000));
                }

                document.getElementById('loadingDesc').innerText = `กำลังส่งข้อมูล... (0/${totalFiles})`;

                await postAndConfirm({
                    action: 'create',
                    optionType: selectedCategory,
                    month: firstFileDate,
                    folderName: finalFolderName,
                    images: base64Images
                }, albums => albums.some(album =>
                    album.folderName === finalFolderName &&
                    album.optionType === selectedCategory &&
                    album.images.length >= totalFiles
                ));
                document.getElementById('loadingModal').style.display = 'none';
                document.getElementById('loadingTitle').innerText = "กำลังอัปโหลด";
                document.getElementById('loadingDesc').innerText = `${totalFiles}/${totalFiles}`;
                showToast("บันทึกสำเร็จ! กำลังกลับหน้าหลัก...");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
            } catch (err) {
                document.getElementById('loadingModal').style.display = 'none';
                showToast(err.message || "เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ", true);
            }
        }
    </script>
</body>
</html>
