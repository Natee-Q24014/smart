<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มอัลบั้มใหม่ - Smart Monitoring Box</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 1rem; display: flex; justify-content: center; align-items: center; }

        .form-container {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 14px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h2 { font-size: 1.2rem; color: #38bdf8; margin-bottom: 1.2rem; border-left: 4px solid #38bdf8; padding-left: 0.5rem; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.4rem; font-weight: 500; }

        input[type="date"], input[type="text"], select {
            width: 100%;
            padding: 0.7rem;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }

        input[type="file"] {
            width: 100%;
            padding: 0.6rem;
            background-color: #0f172a;
            border: 1px dashed #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.4rem;
            margin-top: 0.6rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .preview-img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #475569;
        }

        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            text-align: center;
            text-decoration: none;
        }

        .btn-submit { background-color: #10b981; color: white; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .btn-submit:hover { background-color: #059669; }
        .btn-back { background-color: #334155; color: #94a3b8; }
        .btn-back:hover { background-color: #475569; color: #fff; }

        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 1rem;
        }

        .dialog-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.8rem;
            border-radius: 16px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>➕ เพิ่มอัลบั้มภาพถ่ายใหม่</h2>
        
        <div class="form-group">
            <label>หมวดหมู่ผลงาน:</label>
            <select id="optionType">
                <option value="Smart">⚡ Smart</option>
                <option value="Smartแถม">🎁 Smart (แถม)</option>
            </select>
        </div>

        <div class="form-group">
            <label>วันที่ปฏิบัติงาน:</label>
            <input type="date" id="workDate">
        </div>

        <div class="form-group">
            <label>ชื่อหัวข้ออัลบั้ม:</label>
            <input type="text" id="workTitle" placeholder="เช่น ตรวจเช็กระบบตู้ควบคุมไฟฟ้า...">
        </div>

        <div class="form-group">
            <label>เลือกรูปภาพ (เลือกได้หลายรูป):</label>
            <input type="file" id="imageInput" multiple accept="image/*" onchange="previewImages(event)">
            <div class="preview-container" id="previewContainer"></div>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn btn-back">⬅️ กลับหน้าหลัก</a>
            <button class="btn btn-submit" onclick="submitAlbum()">บันทึกข้อมูล</button>
        </div>
    </div>

    <!-- Modal โหลดดิ้ง -->
    <div id="loadingModal" class="modal">
        <div class="dialog-box">
            <div class="loading-spinner"></div>
            <h3 id="loadingTitle" style="color: #38bdf8; margin-bottom: 0.4rem; font-size: 1.1rem;">กำลังอัปโหลด...</h3>
            <p id="loadingDesc" style="font-size: 0.8rem; color: #94a3b8;">ระบบกำลังบีบอัดรูปและส่งไปยัง Google Drive</p>
        </div>
    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="alertModal" class="modal">
        <div class="dialog-box">
            <h3 id="alertTitle" style="color: #38bdf8; margin-bottom: 0.5rem; font-size: 1.1rem;">แจ้งเตือน</h3>
            <p id="alertDesc" style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 1.2rem; line-height: 1.4;"></p>
            <button class="btn btn-submit" style="width: 100%;" onclick="closeAlertModal()">ตกลง</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyASRCNjL0XhJBWJyNkSRsqiF17vCEXWSX00i59xIaKpY5tWBY448bl0t1P7Fyq0d1Xgg/exec";

        document.getElementById('workDate').valueAsDate = new Date();
        let selectedFilesData = [];

        function previewImages(event) {
            const container = document.getElementById('previewContainer');
            container.innerHTML = '';
            selectedFilesData = [];

            const files = event.target.files;
            for (let file of files) {
                selectedFilesData.push(file);
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-img';
                    container.appendChild(img);
                }
                reader.readAsDataURL(file);
            }
        }

        function showAlert(title, desc, isSuccess = true) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertTitle').style.color = isSuccess ? "#38bdf8" : "#ef4444";
            document.getElementById('alertDesc').innerText = desc;
            document.getElementById('alertModal').style.display = 'flex';
        }

        function closeAlertModal() {
            document.getElementById('alertModal').style.display = 'none';
            if (window.isSuccessSaved) {
                window.location.href = 'index.html';
            }
        }

        async function submitAlbum() {
            const optionType = document.getElementById('optionType').value;
            const dateStr = document.getElementById('workDate').value;
            const titleStr = document.getElementById('workTitle').value.trim();

            if (!dateStr || !titleStr) {
                showAlert("ข้อมูลไม่ครบ", "กรุณากรอกวันที่และชื่อหัวข้ออัลบั้มให้เรียบร้อย", false);
                return;
            }

            if (selectedFilesData.length === 0) {
                showAlert("ยังไม่ได้เลือกรูป", "กรุณาเลือกรูปภาพอย่างน้อย 1 รูป", false);
                return;
            }

            document.getElementById('loadingModal').style.display = 'flex';

            try {
                let compressedImages = [];
                for (let i = 0; i < selectedFilesData.length; i++) {
                    document.getElementById('loadingDesc').innerText = `กำลังบีบอัดรูปภาพ (${i + 1}/${selectedFilesData.length})...`;
                    let base64 = await resizeAndCompressImage(selectedFilesData[i]);
                    compressedImages.push(base64);
                }

                document.getElementById('loadingDesc').innerText = "กำลังอัปโหลดข้อมูลไปยัง Google Drive...";

                const payload = {
                    action: "create",
                    optionType: optionType,
                    date: dateStr,
                    title: titleStr,
                    images: compressedImages
                };

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                document.getElementById('loadingModal').style.display = 'none';

                if (result.status === "success") {
                    window.isSuccessSaved = true;
                    showAlert("สำเร็จ", "สร้างอัลบั้มใหม่และอัปโหลดรูปภาพเรียบร้อยแล้ว", true);
                } else {
                    showAlert("เกิดข้อผิดพลาด", result.message || "ไม่สามารถบันทึกข้อมูลได้", false);
                }

            } catch (error) {
                document.getElementById('loadingModal').style.display = 'none';
                showAlert("เกิดข้อผิดพลาด", "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้", false);
            }
        }

        function resizeAndCompressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1200;
                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    }
                }
            });
        }
    </script>
</body>
</html>
