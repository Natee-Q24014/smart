<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มอัลบั้มภาพถ่ายใหม่ - Smart Monitoring Box</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #262c38; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
        .form-card { background-color: #323b4d; border: 1px solid #434e63; padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 550px; box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
        .form-title { font-size: 1.2rem; color: #38bdf8; font-weight: 700; margin-bottom: 1.2rem; border-left: 4px solid #38bdf8; padding-left: 0.6rem; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.85rem; color: #94a3b8; font-weight: 600; margin-bottom: 0.4rem; }
        .option-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .option-btn { background-color: #262c38; color: #94a3b8; border: 1px solid #4d5b73; padding: 0.7rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: center; }
        .option-btn.active { background-color: #0369a1; color: #fff; border-color: #38bdf8; }
        .form-input { width: 100%; background-color: #262c38; color: #f8fafc; border: 1px solid #4d5b73; padding: 0.7rem 0.9rem; border-radius: 10px; font-size: 0.95rem; font-weight: 600; outline: none; }
        .file-upload-box { border: 2px dashed #4d5b73; padding: 1rem; border-radius: 10px; text-align: center; background-color: #262c38; cursor: pointer; }
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.6rem; margin-top: 0.8rem; max-height: 230px; overflow-y: auto; }
        .preview-item { position: relative; height: 100px; border-radius: 8px; overflow: hidden; border: 1px solid #4d5b73; background: #1e232d; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .img-date-tag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.88); color: #38bdf8; font-size: 0.65rem; font-weight: 700; padding: 2px 4px; text-align: center; }
        .btn-remove-img { position: absolute; top: 3px; right: 3px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; }
        .form-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
        .btn-submit, .btn-back { flex: 1; padding: 0.75rem; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn-submit { background-color: #047857; color: #fff; }
        .btn-back { background-color: #3e495e; color: #cbd5e1; }
        .loading-modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(18, 22, 30, 0.85); justify-content: center; align-items: center; flex-direction: column; }
        .loading-spinner { width: 45px; height: 45px; border: 4px solid #434e63; border-top: 4px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="form-title"><span>➕ เพิ่มอัลบั้มภาพถ่ายใหม่ (AI สแกนอัตโนมัติ)</span></div>
        <form id="uploadForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label class="form-label">หมวดหมู่ผลงาน:</label>
                <div class="option-group">
                    <div id="btnSmart" class="option-btn active" onclick="setCategory('Smart')">Smart</div>
                    <div id="btnFree" class="option-btn" onclick="setCategory('Smartแถม')">Smart (แถม)</div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">วันที่ปฏิบัติงาน:</label>
                <input type="text" id="dateInput" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">ชื่อหัวข้ออัลบั้ม (AI สแกนอัตโนมัติ):</label>
                <input type="text" id="folderNameInput" class="form-input" placeholder="กำลังรอสแกนรูป..." required>
            </div>
            <div class="form-group">
                <label class="form-label">เลือกรูปภาพ:</label>
                <div class="file-upload-box" onclick="document.getElementById('fileInput').click()">
                    <span style="font-size: 1.2rem;">🤖📁</span>
                    <span id="fileCountLabel" style="font-size: 0.85rem; color: #38bdf8; font-weight: 600; display: block; margin-top: 0.2rem;">คลิกเลือกรูปภาพ (รูป 1: ซิม, รูป 2: เนมเพลท)</span>
                </div>
                <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" onchange="handleFileSelect(this)">
                <div id="previewGrid" class="preview-grid" style="display: none;"></div>
            </div>
            <div class="form-actions">
                <a href="index.html" class="btn-back">⬅️ กลับ</a>
                <button type="submit" class="btn-submit">💾 บันทึก</button>
            </div>
        </form>
    </div>

    <div id="loadingModal" class="loading-modal">
        <div class="loading-spinner"></div>
        <h3 id="loadingTitle" style="color: #38bdf8; margin-bottom: 0.3rem; font-size: 1.1rem;">กำลังประมวลผล</h3>
        <p id="loadingDesc" style="font-size: 0.8rem; color: #94a3b8;">โปรดรอสักครู่...</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxgUW-_u80WSW3nYIFEYUXr-uUjyfd_WSC7qlm7N8lgwyA0D5PNUbUDCdSX9JZNPFGjQ/exec";
        
        // 🔑 ใส่ Gemini API Key ของคุณที่นี่ (ขึ้นต้นด้วย AQ...)
        const GEMINI_API_KEY = "ใส่_GEMINI_API_KEY_ของคุณที่นี่"; 

        let selectedCategory = "Smart";
        let selectedFiles = [];

        const today = new Date();
        document.getElementById('dateInput').value = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;

        function setCategory(cat) {
            selectedCategory = cat;
            document.getElementById('btnSmart').className = cat === 'Smart' ? 'option-btn active' : 'option-btn';
            document.getElementById('btnFree').className = cat === 'Smartแถม' ? 'option-btn active' : 'option-btn';
        }

        async function handleFileSelect(input) {
            if (!input.files || input.files.length === 0) return;
            const filesArray = Array.from(input.files);
            
            document.getElementById('loadingTitle').innerText = "AI กำลังวิเคราะห์รูปภาพ";
            document.getElementById('loadingDesc').innerText = "กำลังสแกนรหัส SOD/SOF และเนมเพลทอัตโนมัติ...";
            document.getElementById('loadingModal').style.display = 'flex';

            for (let file of filesArray) {
                await new Promise((resolve) => {
                    EXIF.getData(file, function() {
                        const exifDateTime = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
                        let shootDate = exifDateTime ? parseExifDate(exifDateTime) : (file.lastModified ? new Date(file.lastModified) : new Date());
                        file.formattedDate = formatDateTime(shootDate);
                        file.dateOnly = formatOnlyDate(shootDate);
                        resolve();
                    });
                });
                selectedFiles.push(file);
            }

            if (selectedFiles.length > 0 && selectedFiles[0].dateOnly) {
                document.getElementById('dateInput').value = selectedFiles[0].dateOnly;
            }

            // ส่ง 2 รูปแรกยิงตรงหา Gemini API คืนค่ารูปแบบ SOD/SOF และ TR แบบเดิม
            if (selectedFiles.length >= 2) {
                try {
                    let b64_1 = await fileToBase64(selectedFiles[0], 700);
                    let b64_2 = await fileToBase64(selectedFiles[1], 700);

                    const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                    const promptText = "ดูรูปภาพ 2 รูปนี้ รูปแรกคือซิมการ์ด รูปที่สองคือเนมเพลท\n" +
                        "- รูปแรก: หารหัส SOD หรือ SOF ตามด้วยขีดและเลข 6 หลัก และหา TR ตามด้วยตัวเลข\n" +
                        "- รูปที่สอง: หา Serial No. แล้วแปลงเป็น S/N ตามด้วยเลข 8 หลัก\n" +
                        "- ตอบกลับมารูปแบบเดียวเท่านั้น (ห้ามมีคำอธิบายเพิ่ม): [รหัสซิม] [TR.xxx] [S/Nxxxxxxxx]";

                    const payload = {
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "image/jpeg", data: b64_1 } },
                                { inline_data: { mime_type: "image/jpeg", data: b64_2 } }
                            ]
                        }]
                    };

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const res = await response.json();
                    
                    if (res.candidates && res.candidates[0].content.parts[0].text) {
                        document.getElementById('folderNameInput').value = res.candidates[0].content.parts[0].text.trim();
                    }
                } catch (err) {
                    console.error("Direct Gemini API Error:", err);
                }
            }

            document.getElementById('loadingModal').style.display = 'none';
            renderPreview();
            input.value = '';
        }

        function fileToBase64(file, maxDim) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
                        else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
                    };
                };
            });
        }

        function parseExifDate(str) {
            let p = str.split(/[:\s]/);
            return p.length >= 6 ? new Date(p[0], p[1] - 1, p[2], p[3], p[4], p[5]) : null;
        }
        function formatDateTime(d) {
            return isNaN(d?.getTime()) ? "ไม่ทราบเวลา" : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
        function formatOnlyDate(d) {
            return isNaN(d?.getTime()) ? null : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        function renderPreview() {
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            if (selectedFiles.length === 0) { grid.style.display = 'none'; return; }
            grid.style.display = 'grid';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const item = document.createElement('div');
                    item.className = 'preview-item';
                    item.innerHTML = `<img src="${e.target.result}"><div class="img-date-tag">📅 ${file.formattedDate}</div><button type="button" class="btn-remove-img" onclick="removeFile(${index})">&times;</button>`;
                    grid.appendChild(item);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            if (index === 0 && selectedFiles.length > 0) document.getElementById('dateInput').value = selectedFiles[0].dateOnly;
            renderPreview();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (selectedFiles.length === 0) return alert("กรุณาเลือกรูปภาพ");
            
            document.getElementById('loadingTitle').innerText = "กำลังบันทึกข้อมูล";
            document.getElementById('loadingDesc').innerText = "กำลังอัปโหลดรูปภาพเข้าอัลบั้ม...";
            document.getElementById('loadingModal').style.display = 'flex';

            try {
                let base64Images = [];
                for (let file of selectedFiles) {
                    base64Images.push(await fileToBase64(file, 1200));
                }

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'create',
                        optionType: selectedCategory,
                        month: document.getElementById('dateInput').value,
                        folderName: document.getElementById('folderNameInput').value.trim(),
                        images: base64Images
                    })
                });
                const result = await response.json();
                document.getElementById('loadingModal').style.display = 'none';

                if (result.status === "success") {
                    alert("บันทึกสำเร็จ!");
                    window.location.href = "index.html";
                } else {
                    alert("ผิดพลาด: " + result.message);
                }
            } catch (err) {
                document.getElementById('loadingModal').style.display = 'none';
                alert("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ");
            }
        }
    </script>
</body>
</html>
