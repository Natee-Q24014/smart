<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Monitoring Box - เพิ่มอัลบั้มใหม่</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 1.5rem 1rem; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        .form-card { background-color: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); position: relative; }
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .form-header h2 { font-size: 1.2rem; color: #38bdf8; }
        .btn-back { background-color: #475569; color: white; padding: 0.5rem 0.9rem; border-radius: 6px; font-size: 0.85rem; text-decoration: none; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.4rem; }
        .form-control { width: 100%; padding: 0.75rem 1rem; background-color: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 0.95rem; }
        .form-control:focus { outline: none; border-color: #38bdf8; }
        
        /* สไตล์สำหรับปุ่มเลือก (แถม / ไม่แถม) */
        .radio-group {
            display: flex;
            gap: 1.5rem;
            background-color: #0f172a;
            padding: 0.75rem 1rem;
            border: 1px solid #475569;
            border-radius: 8px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #f8fafc;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .radio-label input {
            accent-color: #38bdf8;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-submit { background-color: #10b981; color: white; border: none; padding: 0.85rem 1rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 1rem; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #059669; }

        /* หน้าจอโหลด Animation (วงกลมหมุน + คำว่า Smart Monitoring เรืองแสง + ตัวนับไฟล์) */
        #loadingOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            border-radius: 16px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(56, 189, 248, 0.2);
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            letter-spacing: 1px;
        }

        .loading-counter {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* กรอบข้อความแจ้งเตือนสำเร็จ */
        #successModal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .success-box {
            background-color: #1e293b;
            border: 2px solid #10b981;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            max-width: 400px;
            width: 100%;
        }

        .success-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .success-title { color: #34d399; font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; }
        .success-desc { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .btn-ok { background-color: #10b981; color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        .btn-ok:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            
            <!-- หน้าจอโหลด Animation -->
            <div id="loadingOverlay">
                <div class="spinner"></div>
                <div class="loading-text">กำลังอัปโหลด...</div>
                <div id="uploadCounter" class="loading-counter">กำลังเตรียมไฟล์...</div>
            </div>

            <!-- กรอบข้อความแจ้งเตือนสำเร็จ -->
            <div id="successModal">
                <div class="success-box">
                    <div class="success-icon">✅</div>
                    <div class="success-title">สำเร็จเรียบร้อย</div>
                    <div class="success-desc">อัปโหลดข้อมูลและรูปภาพเรียบร้อยแล้วครับ</div>
                    <button class="btn-ok" onclick="goToHome()">ตกลง</button>
                </div>
            </div>

            <div class="form-header">
                <h2>➕ เพิ่มข้อมูลและรูปภาพ</h2>
                <a href="index.html" class="btn-back">← กลับหน้าหลัก</a>
            </div>

            <form id="albumForm">
                <div class="form-group">
                    <label>ประเภทงาน</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="optionType" value="ไม่แถม" checked> ไม่แถม (เข้าโฟลเดอร์ Smart)
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="optionType" value="แถม"> แถม (เข้าโฟลเดอร์ Smart(แถม))
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>วันที่ปฏิบัติงาน</label>
                    <input type="text" id="albumDate" class="form-control" placeholder="เช่น 27/12/2569" required>
                </div>
                <div class="form-group">
                    <label>ชื่องาน / หัวข้ออัลบั้ม</label>
                    <input type="text" id="albumTitle" class="form-control" placeholder="เช่น SOD-260123 TR.1234" required>
                </div>
                <div class="form-group">
                    <label>รายละเอียดงาน</label>
                    <textarea id="albumDesc" class="form-control" rows="3" placeholder="ระบุรายละเอียดงาน..." required></textarea>
                </div>
                <div class="form-group">
                    <label>เลือกรูปภาพ (เลือกได้หลายรูป)</label>
                    <input type="file" id="albumImageFiles" class="form-control" accept="image/*" multiple required>
                </div>
                <button type="submit" class="btn-submit">💾 บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgDOewBTLpcGdJFwF43e1z4uWcmH4av0kIYk4xX-PsU-0xMb9ZkBGly24ApKghQggVPg/exec";

        const albumForm = document.getElementById('albumForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const successModal = document.getElementById('successModal');
        const uploadCounter = document.getElementById('uploadCounter');

        function readFileAsBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        albumForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('albumImageFiles');
            const files = fileInput.files;

            if (files.length === 0) return;

            // ดึงค่าประเภทงานที่เลือก (แถม หรือ ไม่แถม)
            const optionType = document.querySelector('input[name="optionType"]:checked').value;

            // แสดงหน้าจอโหลดพร้อมตัวนับ
            loadingOverlay.style.display = 'flex';
            uploadCounter.innerText = `กำลังเตรียมอัปโหลด (0/${files.length})`;

            try {
                let base64Images = [];
                for (let i = 0; i < files.length; i++) {
                    // แสดงตัวเลขไฟล์แบบ (1/20) ตามที่คุณต้องการ
                    uploadCounter.innerText = `กำลังประมวลผลรูปที่ ${i + 1} จาก ${files.length}`;
                    
                    let base64 = await readFileAsBase64(files[i]);
                    base64Images.push(base64);
                }

                uploadCounter.innerText = `กำลังส่งข้อมูลเข้า...`;

                const payload = {
                    optionType: optionType,
                    date: document.getElementById('albumDate').value,
                    title: document.getElementById('albumTitle').value,
                    desc: document.getElementById('albumDesc').value,
                    images: base64Images
                };

                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                // ซ่อนหน้าจอโหลด แล้วแสดงกรอบข้อความสำเร็จ
                loadingOverlay.style.display = 'none';
                successModal.style.display = 'flex';

            } catch (error) {
                loadingOverlay.style.display = 'none';
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            }
        });

        function goToHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
