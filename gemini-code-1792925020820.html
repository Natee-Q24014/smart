<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานภาพถ่ายการทำงาน - Work Photo Report</title>
  <style>
    /* รีเซ็ตรูปแบบพื้นฐาน */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333333;
      padding-bottom: 40px;
    }

    /* ส่วนหัวของเว็บ (Header) */
    header {
      background-color: #0d6efd;
      color: #ffffff;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    header h1 {
      font-size: 1.4rem;
      margin-bottom: 5px;
    }
    header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* กล่องเนื้อหาหลัก */
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* ส่วนจัดกลุ่มตามวันที่ หรือ ชื่องาน */
    .album-section {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .album-header {
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .album-title {
      font-size: 1.1rem;
      color: #0d6efd;
      font-weight: bold;
    }
    .album-date {
      font-size: 0.85rem;
      color: #6c757d;
      background-color: #eef2f7;
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* เลย์เอาต์ตารางแสดงรูปภาพ (Grid) */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    /* การ์ดแต่ละรูปภาพ */
    .photo-card {
      border: 1px solid #e9ecef;
      border-radius: 8px;
      overflow: hidden;
      background-color: #fff;
    }
    .photo-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .photo-details {
      padding: 10px;
    }
    .photo-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .photo-desc {
      font-size: 0.85rem;
      color: #6c757d;
      line-height: 1.4;
    }

    /* สถานะการทำงาน */
    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 3px;
      margin-top: 5px;
      font-weight: bold;
    }
    .bg-success { background-color: #d1e7dd; color: #0f5132; }
    .bg-warning { background-color: #fff3cd; color: #664d03; }
  </style>
</head>
<body>

  <header>
    <h1>อัลบั้มรายงานผลการทำงาน</h1>
    <p>ระบบจัดเก็บและสรุปภาพถ่ายการทำงานประจำวัน</p>
  </header>

  <div class="container">

    <!-- อัลบั้มที่ 1 -->
    <section class="album-section">
      <div class="album-header">
        <div class="album-title">📌 ตรวจเช็กพื้นที่และอุปกรณ์ประจำวัน</div>
        <div class="album-date">25 ต.ค. 2026</div>
      </div>
      
      <div class="photo-grid">
        <div class="photo-card">
          <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=500" alt="รูปงาน 1">
          <div class="photo-details">
            <div class="photo-name">ตรวจเช็กเครื่องจักร A1</div>
            <div class="photo-desc">สภาพแรงดันปกติ ไม่มีจุดรั่วซึม</div>
            <span class="status-badge bg-success">เรียบร้อย</span>
          </div>
        </div>

        <div class="photo-card">
          <img src="https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=500" alt="รูปงาน 2">
          <div class="photo-details">
            <div class="photo-name">จุดจัดเก็บอุปกรณ์ PPE</div>
            <div class="photo-desc">ทำความสะอาดและจัดวางเข้าที่แล้ว</div>
            <span class="status-badge bg-success">เรียบร้อย</span>
          </div>
        </div>
      </div>
    </section>

  </div>

</body>
</html>
